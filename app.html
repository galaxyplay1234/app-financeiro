<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Minhas Finanças</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#6366F1">

<style>
:root {
  --roxo: #6366F1;
  --roxo-escuro: #4F46E5;
  --verde: #10B981;
  --verde-claro: #ECFDF5;
  --verde-grad: linear-gradient(135deg, #10B981, #059669);
  --vermelho: #EF4444;
  --vermelho-claro: #FEF2F2;
  --vermelho-grad: linear-gradient(135deg, #EF4444, #DC2626);
  --laranja: #F59E0B;
  --laranja-claro: #FFFBEB;
  --fundo: #F8FAFC;
  --texto: #1E293B;
  --texto-claro: #94A3B8;
  --branco: #FFFFFF;
  --sombra-suave: 0 2px 12px rgba(0, 0, 0, 0.04);
  --sombra-card: 0 8px 28px rgba(99, 102, 241, 0.1);
  --raio: 20px;
  --raio-pequeno: 12px;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Inter', 'Segoe UI', Roboto, sans-serif;
}

body {
  background: linear-gradient(180deg, #F0F4FF 0%, var(--fundo) 40%);
  min-height: 100vh;
  color: var(--texto);
}

/* CABEÇALHO */
.topo {
  background: linear-gradient(135deg, var(--roxo) 0%, var(--roxo-escuro) 100%);
  padding: 24px 20px 48px;
  border-bottom-left-radius: 36px;
  border-bottom-right-radius: 36px;
  box-shadow: 0 12px 40px rgba(99, 102, 241, 0.3);
  position: relative;
}

.barra-superior {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
}

.topo h2 {
  color: var(--branco);
  font-size: 24px;
  font-weight: 800;
}

.botoes-topo {
  display: flex;
  gap: 12px;
}

.btn-icone {
  width: 44px;
  height: 44px;
  background: rgba(255,255,255,0.22);
  border: none;
  border-radius: 14px;
  color: white;
  font-size: 20px;
  cursor: pointer;
  backdrop-filter: blur(8px);
  transition: all 0.3s ease;
}

.btn-icone:hover {
  background: rgba(255,255,255,0.35);
  transform: translateY(-3px);
}

.navegacao-mes {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 24px;
}

.btn-mes {
  width: 40px;
  height: 40px;
  background: rgba(255,255,255,0.28);
  border: none;
  border-radius: 50%;
  color: white;
  font-size: 20px;
  cursor: pointer;
  transition: all 0.3s ease;
}

.btn-mes:hover {
  background: rgba(255,255,255,0.45);
  transform: scale(1.1);
}

#nomeMes {
  color: white;
  font-size: 18px;
  font-weight: 700;
}

/* CARDS DE SALDO */
.cards-saldos {
  display: flex;
  gap: 14px;
  padding: 0 18px;
  margin-top: -28px;
  position: relative;
  z-index: 10;
}

.card-saldo {
  flex: 1;
  padding: 20px 14px;
  border-radius: var(--raio);
  text-align: center;
  color: white;
  box-shadow: var(--sombra-card);
  transition: all 0.4s ease;
}

.card-saldo:hover {
  transform: translateY(-6px);
}

.card-saldo h4 {
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 8px;
  opacity: 0.9;
}

.valor-principal {
  font-size: clamp(18px, 5vw, 22px);
  font-weight: 900;
  margin-bottom: 4px;
}

.valor-secundario {
  font-size: 12px;
  opacity: 0.85;
}

.saldo {
  background: linear-gradient(145deg, #8B5CF6 0%, #6366F1 100%);
}

.receitas {
  background: var(--verde-grad);
}

.despesas {
  background: var(--vermelho-grad);
}

/* LISTA DE LANÇAMENTOS - DESIGN NOVO */
.lista {
  padding: 32px 18px 100px;
}

.grupo-data {
  margin-bottom: 28px;
}

.etiqueta-data {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: linear-gradient(135deg, var(--roxo-claro) 0%, #DDD6FE 100%);
  color: var(--roxo-escuro);
  padding: 8px 18px;
  border-radius: 30px;
  font-size: 14px;
  font-weight: 700;
  margin-bottom: 14px;
  box-shadow: 0 2px 8px rgba(99, 102, 241, 0.1);
}

/* CARD LANÇAMENTO */
.item-lancamento {
  background: var(--branco);
  border-radius: var(--raio);
  padding: 18px 20px;
  margin-bottom: 14px;
  box-shadow: var(--sombra-suave);
  border: 1px solid rgba(226, 232, 240, 0.6);
  transition: all 0.35s ease;
  cursor: pointer; /* MOSTRA QUE É CLICÁVEL */
  position: relative;
  overflow: hidden;
}

/* INDICADOR LATERAL */
.item-lancamento::after {
  content: '';
  position: absolute;
  right: 0;
  top: 50%;
  transform: translateY(-50%);
  width: 4px;
  height: 0;
  border-radius: 4px 0 0 4px;
  transition: all 0.3s ease;
}

.item-lancamento:hover {
  transform: translateY(-3px) translateX(4px);
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
  border-color: rgba(99, 102, 241, 0.15);
}

.item-lancamento:hover::after {
  height: 60%;
}

/* CORES POR TIPO */
.item-receita { background: linear-gradient(135deg, var(--verde-claro) 0%, #FFFFFF 22%); }
.item-receita::after { background: var(--verde); }

.item-despesa { background: linear-gradient(135deg, var(--vermelho-claro) 0%, #FFFFFF 22%); }
.item-despesa::after { background: var(--vermelho); }

.item-atrasado { background: linear-gradient(135deg, #FEE2E2 0%, #FFFFFF 22%); }
.item-atrasado::after { background: #B91C1C; }

.item-hoje { background: linear-gradient(135deg, var(--laranja-claro) 0%, #FFFFFF 22%); }
.item-hoje::after { background: var(--laranja); }

.conteudo-card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.icone-tipo {
  width: 52px;
  height: 52px;
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  flex-shrink: 0;
}

.item-receita .icone-tipo { background: var(--verde-claro); color: var(--verde); }
.item-despesa .icone-tipo { background: var(--vermelho-claro); color: var(--vermelho); }

.info-principal {
  flex: 1;
  min-width: 0;
}

.nome-item {
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 5px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.categoria-item {
  font-size: 13px;
  color: var(--texto-claro);
  display: flex;
  align-items: center;
  gap: 6px;
}

.valor-status {
  text-align: right;
  flex-shrink: 0;
}

.valor-item {
  font-size: 20px;
  font-weight: 800;
  margin-bottom: 5px;
}

.receita { color: var(--verde); }
.despesa { color: var(--vermelho); }

.status-tags {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  justify-content: flex-end;
}

.status-tag {
  display: inline-block;
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
}

.status-tag.pago { background: var(--verde-claro); color: #065F46; }
.status-tag.recebido { background: var(--verde-claro); color: #065F46; }
.status-tag.atrasado { background: var(--vermelho-claro); color: #991B1B; }
.status-tag.hoje { background: var(--laranja-claro); color: #92400E; }
.status-tag.fixa { background: #F3E8FF; color: #7C3AED; }
.status-tag.parcelado { background: #E0E7FF; color: var(--roxo-escuro); }

.dados-recebimento {
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px dashed #E2E8F0;
  display: flex;
  justify-content: space-between;
  font-size: 13px;
}

.recebido { color: var(--verde); font-weight: 600; }
.falta { color: var(--vermelho); font-weight: 600; }

/* BOTÃO ADICIONAR */
.botao-add {
  position: fixed;
  bottom: 28px;
  right: 28px;
  width: 68px;
  height: 68px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--roxo) 0%, var(--roxo-escuro) 100%);
  border: none;
  color: white;
  font-size: 32px;
  box-shadow: 0 14px 45px rgba(99, 102, 241, 0.45);
  cursor: pointer;
  transition: all 0.4s ease;
  z-index: 30;
}

.botao-add:hover {
  transform: scale(1.15) rotate(90deg);
}

/* MODAL */
.janela-modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.65);
  backdrop-filter: blur(10px);
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 9999;
}

.conteudo-modal {
  background: var(--branco);
  width: 100%;
  max-width: 380px;
  border-radius: 32px;
  padding: 32px 26px;
  box-shadow: 0 24px 70px rgba(0,0,0,0.25);
  animation: surgir 0.4s ease;
}

@keyframes surgir {
  from { opacity: 0; transform: translateY(40px) scale(0.92); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.tipo-lancamento {
  display: flex;
  gap: 12px;
  margin-bottom: 22px;
}

.btn-tipo {
  flex: 1;
  padding: 14px;
  border: 2px solid #E2E8F0;
  background: transparent;
  border-radius: 16px;
  font-weight: 800;
  font-size: 16px;
  cursor: pointer;
  transition: all 0.3s ease;
}

.btn-tipo.ativo.receita {
  background: var(--verde-grad);
  border-color: transparent;
  color: white;
  box-shadow: 0 6px 16px rgba(16, 185, 129, 0.35);
}

.btn-tipo.ativo.despesa {
  background: var(--vermelho-grad);
  border-color: transparent;
  color: white;
  box-shadow: 0 6px 16px rgba(239, 68, 68, 0.35);
}

.campo {
  width: 100%;
  padding: 16px 18px;
  margin-top: 14px;
  border: 2px solid #E2E8F0;
  border-radius: 14px;
  font-size: 16px;
  transition: all 0.3s ease;
  background: #FAFBFC;
}

.campo:focus {
  outline: none;
  border-color: var(--roxo);
  background: white;
  box-shadow: 0 0 0 6px rgba(99, 102, 241, 0.1);
}

.opcoes-parcelamento {
  display: flex;
  gap: 12px;
  margin-top: 16px;
  flex-wrap: wrap;
}

.btn-opcao {
  padding: 12px 18px;
  border: 2px solid #E2E8F0;
  background: white;
  border-radius: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.3s ease;
}

.btn-opcao.ativo {
  border-color: var(--roxo);
  background: linear-gradient(135deg, var(--roxo-claro) 0%, #DDD6FE 100%);
  color: var(--roxo-escuro);
}

.linha-chave {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 18px;
  font-size: 16px;
  font-weight: 600;
}

.interruptor {
  position: relative;
  width: 56px;
  height: 30px;
}

.interruptor input { display: none; }

.alavanca {
  position: absolute;
  inset: 0;
  background: #CBD5E1;
  border-radius: 30px;
  transition: 0.35s ease;
  cursor: pointer;
}

.alavanca::before {
  content: '';
  position: absolute;
  width: 24px;
  height: 24px;
  background: white;
  border-radius: 50%;
  top: 3px;
  left: 3px;
  transition: 0.35s ease;
  box-shadow: 0 3px 8px rgba(0,0,0,0.18);
}

input:checked + .alavanca {
  background: var(--verde-grad);
}

input:checked + .alavanca::before {
  transform: translateX(26px);
}

.botoes-acao {
  margin-top: 22px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.btn {
  padding: 16px;
  border: none;
  border-radius: 14px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.3s ease;
}

.btn.salvar {
  background: linear-gradient(135deg, var(--roxo), var(--roxo-escuro));
  color: white;
  box-shadow: 0 6px 18px rgba(99, 102, 241, 0.3);
}

.btn.excluir {
  background: var(--vermelho-grad);
  color: white;
  box-shadow: 0 6px 18px rgba(239, 68, 68, 0.25);
}

.btn.cancelar {
  background: #F1F5F9;
  color: var(--texto);
}

.btn:hover { transform: translateY(-3px); }

.lista-categorias {
  margin-top: 16px;
  max-height: 280px;
  overflow-y: auto;
}

.item-categoria {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 16px;
  background: #F8FAFC;
  border-radius: 12px;
  margin-bottom: 10px;
  font-weight: 500;
}
</style>
</head>

<body>

<div class="topo">
  <div class="barra-superior">
    <h2>💰 Minhas Finanças</h2>
    <div class="botoes-topo">
      <button class="btn-icone" onclick="openCategoryModal()">☰</button>
      <button class="btn-icone" onclick="goReports()">📊</button>
    </div>
  </div>

  <div class="navegacao-mes">
    <button class="btn-mes" onclick="changeMonth(-1)">&#10094;</button>
    <span id="nomeMes"></span>
    <button class="btn-mes" onclick="changeMonth(1)">&#10095;</button>
  </div>
</div>

<div class="cards-saldos">
  <div class="card-saldo saldo">
    <h4>Saldo Atual</h4>
    <div class="valor-principal" id="saldoPago">R$ 0,00</div>
    <div class="valor-secundario" id="saldoPrev">Previsto: R$ 0,00</div>
  </div>
  <div class="card-saldo receitas">
    <h4>Receitas</h4>
    <div class="valor-principal" id="recPago">R$ 0,00</div>
    <div class="valor-secundario" id="recPrev">Total: R$ 0,00</div>
  </div>
  <div class="card-saldo despesas">
    <h4>Despesas</h4>
    <div class="valor-principal" id="despPago">R$ 0,00</div>
    <div class="valor-secundario" id="despPrev">Total: R$ 0,00</div>
  </div>
</div>

<section class="lista" id="list"></section>

<button class="botao-add" onclick="openModal()">+</button>

<!-- MODAL PRINCIPAL -->
<div class="janela-modal" id="modal">
  <div class="conteudo-modal">
    <div class="tipo-lancamento">
      <button class="btn-tipo receita ativo" onclick="setType('income')">Receita</button>
      <button class="btn-tipo despesa" onclick="setType('expense')">Despesa</button>
    </div>

    <input class="campo" id="title" placeholder="Nome do lançamento">
    <input class="campo" id="value" placeholder="Valor" inputmode="decimal">

    <div id="receivedArea" style="display:none">
      <input class="campo" id="receivedValue" placeholder="Valor recebido" inputmode="decimal">
    </div>

    <select class="campo" id="category">
      <option>Geral</option>
      <option>Alimentação</option>
      <option>Moradia</option>
      <option>Transporte</option>
    </select>

    <input class="campo" id="date" type="date">

    <div class="opcoes-parcelamento">
      <button class="btn-opcao" id="btnParcel" onclick="toggleParcel()">Parcelado</button>
      <button class="btn-opcao" id="btnFixed" onclick="toggleFixed()">Fixa</button>
      <input class="campo" id="parcelCount" type="number" min="2" placeholder="Qtd. meses" style="display:none; width: 130px; margin:0;">
    </div>

    <div class="linha-chave">
      <span>Já pago/recebido?</span>
      <label class="interruptor">
        <input type="checkbox" id="paid">
        <span class="alavanca"></span>
      </label>
    </div>

    <div class="linha-chave" id="editAllRow" style="display:none">
      <span>Editar todas</span>
      <label class="interruptor">
        <input type="checkbox" id="editAll">
        <span class="alavanca"></span>
      </label>
    </div>

    <div class="botoes-acao">
      <button class="btn salvar" onclick="save()">Salvar lançamento</button>
      <button class="btn excluir" id="deleteBtn" onclick="remove()" style="display:none">Excluir</button>
      
      <div id="parcelDeleteOptions" style="display:none;">
        <div style="display:flex; gap:10px">
          <button class="btn excluir" onclick="removeAllParcels()">Todas</button>
          <button class="btn excluir" onclick="removeCurrentParcel()">Apenas esta</button>
        </div>
      </div>

      <button class="btn cancelar" onclick="closeModal()">Cancelar</button>
    </div>
  </div>
</div>

<!-- MODAL CATEGORIAS -->
<div class="janela-modal" id="categoryModal">
  <div class="conteudo-modal">
    <h3 style="margin-bottom:20px; font-weight:800">Categorias</h3>
    <input class="campo" id="categoryName" placeholder="Nova categoria">
    <button class="btn salvar" style="margin-top:10px" onclick="saveCategory()">Cadastrar</button>
    <div class="lista-categorias" id="categoryList"></div>
    <button class="btn cancelar" onclick="closeCategoryModal()">Fechar</button>
  </div>
</div>

<script>
  if (localStorage.getItem("logged") !== "true") window.location.href = "index.html";
  localStorage.removeItem("logged");
</script>

<script>
let currentMonth = new Date();
let editId = null;
let editMonthKey = null;
let currentType = "income";
let editingParcelData = null;
let editingItem = null;

const monthLabel = document.getElementById("nomeMes");
const modal = document.getElementById("modal");
const deleteBtn = document.getElementById("deleteBtn");
const valueInput = document.getElementById("value");
const receivedInput = document.getElementById("receivedValue");

valueInput.addEventListener("input",()=>{
  let v = valueInput.value.replace(/\D/g,"");
  v = (Number(v)/100).toLocaleString("pt-BR",{minimumFractionDigits:2});
  valueInput.value = v;
});
receivedInput.addEventListener("input",()=>{
  let v = receivedInput.value.replace(/\D/g,"");
  v = (Number(v)/100).toLocaleString("pt-BR",{minimumFractionDigits:2});
  receivedInput.value = v;
});

function updateMonthLabel(){
  const meses=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
  monthLabel.innerText = `${meses[currentMonth.getMonth()]} ${currentMonth.getFullYear()}`;
}
function getMonthKey(){
  return `${currentMonth.getFullYear()}-${String(currentMonth.getMonth()+1).padStart(2,"0")}`;
}
function formatDate(d){
  const [y,m,day]=d.split("-");
  return `${day}/${m}`;
}

function monthRef(){return firebase.database().ref("finance/meses/"+getMonthKey())}
function categoriesRef(){return firebase.database().ref("finance/categorias")}

function changeMonth(step){
  currentMonth = new Date(currentMonth.getFullYear(), currentMonth.getMonth() + step, 1);
  updateMonthLabel();
  render();
}

function setType(t){
  currentType = t;
  document.querySelectorAll(".btn-tipo").forEach(b => b.classList.remove("ativo"));
  document.querySelector(`.btn-tipo.${t}`).classList.add("ativo");
  document.getElementById("receivedArea").style.display = t === "income" && !paid.checked ? "block" : "none";
}

let isParcel = false, isFixed = false;
function toggleParcel(){
  isParcel = !isParcel; isFixed = false;
  document.getElementById("btnFixed").classList.remove("ativo");
  document.getElementById("btnParcel").classList.toggle("ativo", isParcel);
  document.getElementById("parcelCount").style.display = isParcel ? "block" : "none";
  if(!isParcel) document.getElementById("parcelCount").value = "";
}
function toggleFixed(){
  isFixed = !isFixed; isParcel = false;
  document.getElementById("btnParcel").classList.remove("ativo");
  document.getElementById("parcelCount").style.display = "none";
  document.getElementById("btnFixed").classList.toggle("ativo", isFixed);
}

async function checkMonthTurnover(){
  if(new Date().getDate() !== 1) return;
  const curr = getMonthKey(), prev = getMonthKeyFromDate(new Date(Date.now()-86400000).toISOString());
  const snap = await firebase.database().ref("finance/saldos/"+curr).once("value");
  if(snap.exists()) return;
  const prevSnap = await firebase.database().ref("finance/meses/"+prev).once("value");
  let saldo = 0;
  Object.values(prevSnap.val()||{}).forEach(t=>{
    if(!t.paid) return;
    saldo += t.type==="income" ? t.value : -t.value;
  });
  await firebase.database().ref("finance/saldos/"+curr).set(saldo);
}

async function render(){
  const container = document.getElementById("list");
  container.innerHTML = "";
  let rPago=0, rPrev=0, dPago=0, dPrev=0;

  monthRef().off();
  monthRef().on("value", async snap=>{
    const data = snap.val() || {};
    const list = Object.values(data).sort((a,b)=>new Date(b.date)-new Date(a.date));
    container.innerHTML = "";

    const saldoSnap = await firebase.database().ref("finance/saldos/"+getMonthKey()).once("value");
    let saldoInicial = Number(saldoSnap.val()||0);

    const grouped = {};
    list.forEach(t=>grouped[t.date] ? grouped[t.date].push(t) : grouped[t.date]=[t]);

    Object.keys(grouped).sort((a,b)=>new Date(b)-new Date(a)).forEach(date=>{
      
      const grupoData = document.createElement("div");
      grupoData.className = "grupo-data";
      
      const dataLinha = document.createElement("div");
      dataLinha.className = "etiqueta-data";
      dataLinha.innerHTML = `<span>📅</span> ${formatDate(date)}`;
      grupoData.appendChild(dataLinha);

      grouped[date].sort((a,b)=>b.value-a.value).forEach(t=>{
        
        if(t.type==="income"){
          const rec = t.receivedValue || (t.paid?t.value:0);
          rPago += rec; rPrev += (t.value - rec);
        }else t.paid ? dPago += t.value : dPrev += t.value;

        const today = getTodayLocalString();
        const isLate = !t.paid && t.date < today;
        const isDueToday = !t.paid && t.date === today;

        const item = document.createElement("div");
        item.className = `item-lancamento ${t.type==="income"?"item-receita":"item-despesa"} ${isLate?"item-atrasado":""} ${isDueToday?"item-hoje":""}`;
        
        // ✅ FUNÇÃO DE CLIQUE PARA EDITAR - GARANTIDA E FUNCIONAL
        item.onclick = () => editById(t.id);

        // Ícones e status
        const icone = t.type === "income" ? "⬆️" : "⬇️";
        let statusHtml = "";
        if(t.paid) statusHtml += `<span class="status-tag ${t.type==="income"?"recebido":"pago"}">${t.type==="income"?"Recebido":"Pago"}</span>`;
        else if(isLate) statusHtml += `<span class="status-tag atrasado">Atrasado</span>`;
        else if(isDueToday) statusHtml += `<span class="status-tag hoje">Vence Hoje</span>`;
        
        if(t.fixed) statusHtml += `<span class="status-tag fixa">Fixa</span>`;
        if(t.parcel) statusHtml += `<span class="status-tag parcelado">${t.parcelIndex}/${t.parcelTotal}</span>`;

        item.innerHTML = `
          <div class="conteudo-card">
            <div class="icone-tipo">${icone}</div>
            <div class="info-principal">
              <div class="nome-item">${t.name}</div>
              <div class="categoria-item">🏷️ ${t.category}</div>
            </div>
            <div class="valor-status">
              <div class="valor-item ${t.type}">R$ ${t.value.toLocaleString("pt-BR",{minimumFractionDigits:2})}</div>
              <div class="status-tags">${statusHtml}</div>
            </div>
          </div>

          ${t.type==="income"&&!t.paid&&(t.receivedValue||0)>0?`
            <div class="dados-recebimento">
              <span class="recebido">✅ Recebido: R$ ${(t.receivedValue||0).toLocaleString("pt-BR",{minimumFractionDigits:2})}</span>
              <span class="falta">❌ Falta: R$ ${((t.value||0)-(t.receivedValue||0)).toLocaleString("pt-BR",{minimumFractionDigits:2})}</span>
            </div>`:''}
        `;
        grupoData.appendChild(item);
      });
      container.appendChild(grupoData);
    });

    recPago.innerText = `R$ ${rPago.toLocaleString("pt-BR",{minimumFractionDigits:2})}`;
    recPrev.innerText = `R$ ${(rPago+rPrev).toLocaleString("pt-BR",{minimumFractionDigits:2})}`;
    despPago.innerText = `R$ ${dPago.toLocaleString("pt-BR",{minimumFractionDigits:2})}`;
    despPrev.innerText = `R$ ${(dPago+dPrev).toLocaleString("pt-BR",{minimumFractionDigits:2})}`;
    saldoPago.innerText = `R$ ${(saldoInicial+rPago-dPago).toLocaleString("pt-BR",{minimumFractionDigits:2})}`;
    saldoPrev.innerText = `R$ ${(saldoInicial+rPago+rPrev-dPago-dPrev).toLocaleString("pt-BR",{minimumFractionDigits:2})}`;
  });
}

async function save(){
  const valTotal = Number(valueInput.value.replace(/\./g,"").replace(",","."));
  let valReceived = Number((receivedInput.value||"0").replace(/\./g,"").replace(",","."))||0;
  if(currentType==="income"&&paid.checked) valReceived = valTotal;
  const remaining = Math.max(0, valTotal - valReceived);
  const baseDate = date.value;

  if(editingItem?.parcel && isFixed){
    await convertParcelToFixed(valReceived, remaining);
    closeModal(); render(); return;
  }

  if(!isParcel && !isFixed){
    if((editingItem?.parcel||editingItem?.fixed)&&document.getElementById("editAll").checked){
      await updateParcelGroup(valReceived, remaining);
      closeModal(); render(); return;
    }
    const id = editId||Date.now().toString();
    const item = {id,name:title.value.trim(),value:valTotal,receivedValue:valReceived,remainingValue:remaining,
      category:category.value,date:baseDate,type:currentType,paid:paid.checked,
      fixed:isFixed,parcel:!!editingParcelData,parcelIndex:editingParcelData?.parcelIndex,
      parcelTotal:editingParcelData?.parcelTotal,parcelGroupId:editingParcelData?.parcelGroupId};
    const newMonth = getMonthKeyFromDate(item.date);
    if(editId&&editMonthKey!==newMonth) await firebase.database().ref("finance/meses/"+editMonthKey+"/"+id).remove();
    await firebase.database().ref("finance/meses/"+newMonth+"/"+id).set(item);
    closeModal(); render(); return;
  }

  if(isFixed){
    if(editId&&editingItem?.fixed){await updateFixedGroup(valReceived,remaining); closeModal();render();return}
    const groupId = Date.now().toString();
    for(let i=0;i<12;i++){
      const d = new Date(baseDate); d.setMonth(d.getMonth()+i);
      const ds = d.toISOString().split("T")[0], mk = getMonthKeyFromDate(ds), id = `${groupId}_${i+1}`;
      await firebase.database().ref("finance/meses/"+mk+"/"+id).set({id,name:title.value.trim(),value:valTotal,
        receivedValue:0,remainingValue:valTotal,category:category.value,date:ds,type:currentType,
        paid:false,fixed:true,parcel:false,parcelGroupId:groupId,parcelIndex:i+1,parcelTotal:12});
    }
    closeModal(); render(); return;
  }

  if(isParcel && editId && editingItem?.parcel){await updateParcelGroup(valReceived,remaining); closeModal();render();return}
  if(editingItem?.fixed && isParcel){await deleteGroup(editingItem.parcelGroupId); editId=editingItem=editingParcelData=null}
  if((editingItem?.parcel||editingItem?.fixed)&&!isParcel&&!isFixed){await deleteGroup(editingItem.parcelGroupId); editId=editingItem=editingParcelData=null}

  const totalParc = Number(parcelCount.value);
  if(totalParc<2){alert("Informe a quantidade de parcelas");return}
  const groupId = Date.now().toString();
  for(let i=0;i<totalParc;i++){
    const d = new Date(baseDate); d.setMonth(d.getMonth()+i);
    const ds = d.toISOString().split("T")[0], mk = getMonthKeyFromDate(ds), id = `${groupId}_${i+1}`, pago = i===0?paid.checked:false;
    await firebase.database().ref("finance/meses/"+mk+"/"+id).set({id,name:title.value.trim(),value:valTotal,
      receivedValue:currentType==="income"&&pago?valTotal:0,remainingValue:currentType==="income"&&pago?0:valTotal,
      category:category.value,date:ds,type:currentType,paid:pago,parcel:true,
      parcelIndex:i+1,parcelTotal:totalParc,parcelGroupId:groupId});
  }
  closeModal(); render();
}

async function updateParcelGroup(valReceived,remaining){
  const snap = await firebase.database().ref("finance/meses").once("value");
  const meses = snap.val()||{}, novoVal = Number(valueInput.value.replace(/\./g,"").replace(",","."));
  const promises = [], novoDia = new Date(date.value).getDate();
  Object.entries(meses).forEach(([mk,items])=>{
    Object.entries(items).forEach(([id,item])=>{
      if(item.parcelGroupId===editingItem.parcelGroupId && item.parcelIndex>=editingItem.parcelIndex){
        item.name=title.value.trim();item.category=category.value;item.value=novoVal;item.type=currentType;
        const d = new Date(item.date); d.setDate(novoDia); item.date = d.toISOString().split("T")[0];
        if(item.id===editingItem.id){
          item.paid=paid.checked;
          if(currentType==="income"){item.receivedValue=valReceived;item.remainingValue=remaining}
        }else item.remainingValue = Math.max(0, novoVal - (item.receivedValue||0));
        promises.push(firebase.database().ref("finance/meses/"+mk+"/"+id).set(item));
      }
    })
  });
  await Promise.all(promises);
}

async function convertParcelToFixed(valReceived,remaining){
  const snap = await firebase.database().ref("finance/meses").once("value");
  const meses = snap.val()||{}, novoVal = Number(valueInput.value.replace(/\./g,"").replace(",","."));
  const promises = [], novoDia = new Date(date.value).getDate();
  Object.entries(meses).forEach(([mk,items])=>{
    Object.entries(items).forEach(([id,item])=>{
      if(item.parcelGroupId===editingItem.parcelGroupId && item.parcelIndex>=editingItem.parcelIndex){
        item.fixed=true;item.parcel=false;item.name=title.value.trim();item.category=category.value;
        item.value=novoVal;item.type=currentType;
        const d = new Date(item.date); d.setDate(novoDia); item.date = d.toISOString().split("T")[0];
        if(item.id===editingItem.id){item.paid=paid.checked; if(currentType==="income"){item.receivedValue=valReceived;item.remainingValue=remaining}}
        else item.remainingValue = Math.max(0, novoVal - (item.receivedValue||0));
        promises.push(firebase.database().ref("finance/meses/"+mk+"/"+id).set(item));
      }
    })
  });
  await Promise.all(promises);
}

// ✅ FUNÇÃO DE EDIÇÃO - MANTIDA E 100% FUNCIONAL
function editById(id){
  const mk = getMonthKey();
  firebase.database().ref("finance/meses/"+mk+"/"+id).once("value",snap=>{
    const t = snap.val(); editingItem = t;
    document.getElementById("editAllRow").style.display = (t.parcel||t.fixed)?"flex":"none";
    document.getElementById("editAll").checked = false;
    title.value=t.name; valueInput.value=t.value.toLocaleString("pt-BR",{minimumFractionDigits:2});
    receivedInput.value=(t.receivedValue||0).toLocaleString("pt-BR",{minimumFractionDigits:2});
    document.getElementById("receivedArea").style.display = t.type==="income"&&!t.paid?"block":"none";
    category.value=t.category; date.value=t.date; paid.checked=t.paid; currentType=t.type;
    editingParcelData = (t.parcel||t.fixed)?{parcelIndex:t.parcelIndex,parcelTotal:t.parcelTotal,parcelGroupId:t.parcelGroupId}:null;
    isParcel=!!t.parcel; isFixed=!!t.fixed;
    document.getElementById("btnParcel").classList.toggle("ativo",isParcel);
    document.getElementById("btnFixed").classList.toggle("ativo",isFixed);
    document.getElementById("parcelCount").style.display=isParcel?"block":"none";
    document.getElementById("parcelCount").value = t.parcelTotal||"";
    setType(currentType); editId=id; editMonthKey=mk; deleteBtn.style.display="block"; openModal();
  })
}

function remove(){
  if(!editingItem?.parcel && !editingItem?.fixed){monthRef().child(editId).remove();closeModal();render();return}
  deleteBtn.style.display="none"; document.getElementById("parcelDeleteOptions").style.display="block";
}
function removeParcelGroup(gid){
  firebase.database().ref("finance/meses").once("value",snap=>{
    const meses = snap.val()||[], prom=[];
    Object.entries(meses).forEach(([mk,items])=>{
      Object.entries(items).forEach(([id,item])=>{
        if(item.parcelGroupId===gid && item.parcelIndex>=editingItem.parcelIndex)
          prom.push(firebase.database().ref("finance/meses/"+mk+"/"+id).remove());
      })
    });
    Promise.all(prom).then(()=>{closeModal();render()})
  })
}
async function deleteGroup(gid){
  const snap = await firebase.database().ref("finance/meses").once("value");
  const meses = snap.val()||[], prom=[];
  Object.entries(meses).forEach(([mk,items])=>{
    Object.entries(items).forEach(([id,item])=>{
      if(item.parcelGroupId===gid) prom.push(firebase.database().ref("finance/meses/"+mk+"/"+id).remove());
    })
  });
  await Promise.all(prom);
}
function removeAllParcels(){removeParcelGroup(editingItem.parcelGroupId)}
function removeCurrentParcel(){monthRef().child(editId).remove().then(()=>{closeModal();render()})}

function openModal(){
  modal.style.display="flex";
  if(editId===null){
    title.value=valueInput.value=receivedInput.value="";
    setType("income"); isParcel=isFixed=false;
    document.getElementById("btnParcel").classList.remove("ativo");
    document.getElementById("btnFixed").classList.remove("ativo");
    document.getElementById("parcelCount").style.display="none";
    document.getElementById("editAllRow").style.display="none";
    paid.checked=false;
    const hoje = new Date();
    date.value = `${hoje.getFullYear()}-${String(hoje.getMonth()+1).padStart(2,"0")}-${String(hoje.getDate()).padStart(2,"0")}`;
    deleteBtn.style.display="none"; document.getElementById("parcelDeleteOptions").style.display="none";
  }
}
function closeModal(){
  modal.style.display="none"; editId=editMonthKey=editingItem=editingParcelData=null;
  isParcel=isFixed=false;
  document.getElementById("btnParcel").classList.remove("ativo");
  document.getElementById("btnFixed").classList.remove("ativo");
  document.getElementById("parcelCount").style.display="none";
  document.getElementById("parcelDeleteOptions").style.display="none";
  deleteBtn.style.display="block";
}

function saveCategory(){
  const n = document.getElementById("categoryName").value.trim();
  if(!n) return; categoriesRef().child(n).set(true);
  document.getElementById("categoryName").value=""; renderCategories(); updateCategorySelect();
}
function deleteCategory(n){categoriesRef().child(n).remove();renderCategories();updateCategorySelect()}
function renderCategories(){
  const c = document.getElementById("categoryList"); c.innerHTML="";
  categoriesRef().once("value",snap=>{
    Object.keys(snap.val()||{}).sort((a,b)=>a.localeCompare(b,'pt-BR')).forEach(n=>{
      const d = document.createElement("div"); d.className="item-categoria";
      d.innerHTML = `<span>${n}</span><button style="background:none;border:none;color:#EF4444;font-size:20px;cursor:pointer">×</button>`;
      d.querySelector("button").onclick = ()=>deleteCategory(n);
      c.appendChild(d);
    })
  })
}
function updateCategorySelect(){
  const s = document.getElementById("category"); s.innerHTML="";
  categoriesRef().once("value",snap=>{
    Object.keys(snap.val()||{}).forEach(n=>{
      const o = document.createElement("option"); o.value=o.innerText=n; s.appendChild(o);
    })
  })
}

function getTodayLocalString(){const n=new Date();return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,"0")}-${String(n.getDate()).padStart(2,"0")}`}
