<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Minhas Finanças</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1976d2">

<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{
  margin:0;
  background:#f4f6f8;
  overflow-x:hidden;
}

.top-fixed{
  position:sticky;
  top:0;
  z-index:20;
  background:#f4f6f8;
}

/* HEADER */
header{
  background:#1976d2;
  color:#fff;
  padding:12px;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
}

header h2{
  margin:0;
  font-size:18px;
  font-weight:600;
}

.cat-btn{
  background:transparent;
  border:none;
  color:#fff;
  font-size:22px;
  cursor:pointer;
  padding:4px 6px;
}
.cat-btn:active{opacity:.6}

.month-tabs{
  width:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:14px;
  margin-top:6px;
}

.month-btn{
  background:transparent;
  border:none;
  color:#fff;
  font-size:22px;
  cursor:pointer;
  padding:4px 6px;
}

.month-btn:active{opacity:.6}

#monthLabel{
  font-size:14px;
  font-weight:500;
  min-width:140px;
  text-align:center;
}

.cards{
  display:flex;
  gap:10px;
  padding:10px;
}
.card{
  flex:1;background:#fff;padding:12px;border-radius:10px;
  text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.1)
}
.card h4{margin:0;font-size:14px;color:#666}
.card .main{
    margin-top:6px;

    display:flex;
    justify-content:center;
    align-items:center;

    white-space:nowrap;
    overflow:hidden;

    font-size:clamp(14px,3.8vw,18px);
    font-weight:bold;
    line-height:1;
}
.card .sub{
    margin-top:3px;
    font-size:clamp(11px,3vw,13px);
    color:#777;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}
.saldo{border-top:4px solid #1976d2}
.receita{border-top:4px solid #2e7d32}
.despesa{border-top:4px solid #c62828}

/* LISTA */
.list{padding:10px}
.row{display:flex;gap:8px;margin-bottom:8px;cursor:pointer}
.date-card{
  width:56px;height:64px;background:#fff;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:bold;color:#888;
  box-shadow:0 1px 4px rgba(0,0,0,.1)
}
.item{
  flex:1;
  background:#fff;
  padding:10px;
  border-left:5px solid #2196f3;
  box-shadow:0 1px 4px rgba(0,0,0,.1);
  border-radius:0;
  margin:0;
}

.item.first-of-day{
  border-top-left-radius:10px;
  border-top-right-radius:10px;
}

.item.last-of-day{
  border-bottom-left-radius:10px;
  border-bottom-right-radius:10px;
}

.day-items{
  display:flex;
  flex-direction:column;
  gap:0;
}

.item:not(:last-child){
    border-bottom:0.5px solid #ececec;
}

.item-value{
    font-size:16px;
    font-weight:bold;
}

.income{
    color:#2e7d32;
}

.expense{
    color:#c62828;
}

.item-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
}

.item-bottom{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:4px;
}

.item-name{
    font-size:14px;
    font-weight:bold;
}

.item-value{
    font-size:16px;
    font-weight:bold;
}

.item-sub{
    font-size:12px;
    color:#666;
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:4px;
}

.parcel-badge{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    padding:2px 8px;
    font-size:11px;
    font-weight:600;
    line-height:1;
    color:#5F6670;
    background:#EEF2F8;
    border:1px solid #D8DEE8;
    border-radius:999px;
    width:max-content;
    vertical-align:middle;
    position:relative;
}

.received{
    margin-top:4px;
    text-align:right;
    font-size:12px;
    line-height:1.25;
}

.badge{
    padding:2px 8px;
    border-radius:12px;
    color:#fff;
    font-size:12px;
    white-space:nowrap;
}
.green{background:#4EAE51}
.red{background:#F24438}

/* FAB */
.fab{
  position:fixed;right:20px;bottom:20px;
  width:56px;height:56px;border-radius:50%;
  font-size:26px;background:#1976d2;color:#fff;border:none
}

/* MODAL */
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  justify-content:center;
  align-items:center;
  z-index:9999; /* 👈 ESSA LINHA resolve tudo */
}
.modal-content{
  background:#fff;width:90%;max-width:320px;
  padding:16px;border-radius:12px;
  font-size:16px
}

/* TYPE BUTTONS */
.type-buttons{display:flex;gap:8px;margin-bottom:8px}
/* BOTÃO PADRÃO (NÃO SELECIONADO) */
.type-btn{
  flex:1;
  padding:10px;
  border-radius:8px;

  /* visual que você pediu */
  background:#fff;              /* fundo branco */
  border:1px solid #ccc;        /* contorno cinza 1px */
  color:#777;                   /* texto cinza */

  font-weight:bold;
}

/* RECEITA SELECIONADA */
.type-btn.active.income{
  background:#2e7d32;
  color:#fff;
  border:none;
}

/* DESPESA SELECIONADA */
.type-btn.active.expense{
  background:#c62828;
  color:#fff;
  border:none;
}

/* INPUTS */
.modal-content input,
.modal-content select,
.modal-content button{
  width:100%;margin-top:8px;padding:10px;
  border-radius:8px;border:1px solid #ccc;
  font-size:16px
}

.modal-content input[type="date"]{
  width:100%;
  box-sizing:border-box;
  -webkit-appearance:none;
  appearance:none;
}

/* ===============================
   CORREÇÃO BOTÕES RECEITA / DESPESA
   =============================== */

/* botão padrão (não selecionado) */
.modal-content .type-btn{
  background:#fff !important;
  border:1px solid #ccc !important;
  color:#777 !important;
}

/* receita ativa */
.modal-content .type-btn.active.income{
  background:#2e7d32 !important;
  color:#fff !important;
  border:none !important;
}

/* despesa ativa */
.modal-content .type-btn.active.expense{
  background:#c62828 !important;
  color:#fff !important;
  border:none !important;
}

/* SWITCH */
.switch-row{
  display:flex;justify-content:space-between;
  align-items:center;margin-top:10px
}
.switch{position:relative;width:46px;height:26px}
.switch input{display:none}
.slider{
  position:absolute;inset:0;cursor:pointer;
  background:#ccc;border-radius:26px;transition:.3s
}
.slider:before{
  content:"";position:absolute;width:20px;height:20px;
  left:3px;top:3px;background:#fff;border-radius:50%;
  transition:.3s
}
input:checked + .slider{background:#2e7d32}
input:checked + .slider:before{transform:translateX(20px)}

/* BUTTONS */
.modal-content button{background:#1976d2;color:#fff;border:none}
.modal-content button.cancel{background:#9e9e9e}
.modal-content button.delete{background:#c62828}

/* ===============================
   PARCELAMENTO
=============================== */
.parcel-buttons{
  display:flex;
  gap:8px;
  margin-top:8px;
  align-items:center;
}

.parcel-btn{
  width:auto !important;
  background:#fff !important;
  color:#777 !important;
  border:1px solid #ccc !important;
  font-weight:bold; /* 👈 AQUI resolve */
}

/* ATIVO */
.parcel-btn.active{
  border-color:#1976d2 !important;
  color:#1976d2 !important;
}

.category-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#f4f6f8;
  padding:8px 10px;
  border-radius:8px;
  margin-top:6px;
  font-size:14px;
}

.category-item button{
  background:none;
  border:none;
  color:#c62828;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;

  /* alinhamento perfeito */
  display:flex;
  align-items:center;
  justify-content:center;

  /* área de clique mínima */
  width:20px;
  height:20px;

  padding:0;
  line-height:1;
}

#categoryModal .modal-content{
  max-height:80vh;
  display:flex;
  flex-direction:column;
}

#categoryList{
  overflow-y:auto;
  max-height:260px;
}

/* remove espaço entre itens do mesmo dia */
.day-items{
  display:flex;
  flex-direction:column;
  gap:0;
}

/* ITEM ATRASADO */
.late-item{
  background: #fdecea; /* vermelho bem clarinho */
  border-left-color: #F24438; /* mantém coerência com despesa */
}

/* ITEM VENCE HOJE */
.due-today-item{
  background:#fff4e5;           /* laranja bem clarinho */
  border-left-color:#FD9806;    /* laranja */
}

/* ITEM PAGO / RECEBIDO */
.paid-item{
    border-left-color:#2e7d32;
}

.badge.orange{
    background:#FD9806;
}

.received{
    margin-top:4px;
    text-align:right;
    font-size:12px;
    line-height:1.25;
}

.ok{
    color:#2e7d32;
}

.rest{
    color:#F24438;
}

.fixed-badge{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    padding:2px 8px;
    font-size:11px;
    font-weight:600;
    line-height:1;
    color:#7B1FA2;
    background:#F3E5F5;
    border:1px solid #CE93D8;
    border-radius:999px;
    width:max-content;
    vertical-align:middle;
    position:relative;
}

</style>
</head>

<body>

<div class="top-fixed">

  <header>
    <div style="width:100%;display:flex;justify-content:space-between;align-items:center">
  <h2>💰 Minhas Finanças</h2>

  <div style="display:flex;gap:10px">
  <button class="cat-btn" onclick="openCategoryModal()">☰</button>
  <button class="cat-btn" onclick="goReports()">📊</button>
</div>
</div>
    <div class="month-tabs">
      <button class="month-btn" onclick="changeMonth(-1)">&#10094;</button>
      <span id="monthLabel"></span>
      <button class="month-btn" onclick="changeMonth(1)">&#10095;</button>
    </div>
  </header>

  <section class="cards">
    <div class="card saldo">
      <h4>Saldo</h4>
      <div class="main" id="saldoPago">R$ 0,00</div>
      <div class="sub" id="saldoPrev">R$ 0,00</div>
    </div>

    <div class="card receita">
      <h4>Receitas</h4>
      <div class="main" id="recPago">R$ 0,00</div>
      <div class="sub" id="recPrev">R$ 0,00</div>
    </div>

    <div class="card despesa">
  <h4>Despesas</h4>

  <div class="main" id="despPago">R$ 0,00</div>

  <div class="sub" id="despPrev">
    R$ 0,00
  </div>

  <div
    class="sub"
    id="despAtrasadas"
    style="color:#F24438;font-weight:bold;">
    R$ 0,00
</div>
</div>
  </section>

</div>

<section class="list" id="list"></section>

<button class="fab" onclick="openModal()">+</button>

<div class="modal" id="modal">
<div class="modal-content">

<div class="type-buttons">
  <button class="type-btn income active" onclick="setType('income')">Receita</button>
  <button class="type-btn expense" onclick="setType('expense')">Despesa</button>
</div>

<input id="title" placeholder="Nome">
<input id="value" placeholder="Valor">
  <div id="receivedArea" style="display:none">
  <input id="receivedValue" placeholder="Valor recebido">
</div>
<select id="category">
  <option>Geral</option>
  <option>Alimentação</option>
  <option>Moradia</option>
  <option>Transporte</option>
</select>
<input id="date" type="date">
  
<!-- PARCELAMENTO -->
<div class="parcel-buttons">

    <button id="btnParcel" class="parcel-btn" onclick="toggleParcel()">
        Parcelado
    </button>

    <button id="btnFixed" class="parcel-btn" onclick="toggleFixed()">
        Fixa
    </button>

    <input
        id="parcelCount"
        type="number"
        min="2"
        placeholder="Meses"
        style="display:none;width:110px"
    >

</div>

<div class="switch-row">
  <span>Pago</span>
  <label class="switch">
    <input type="checkbox" id="paid">
    <span class="slider"></span>
  </label>
</div>

<div class="switch-row" id="editAllRow" style="display:none">
    <span>Editar parcelas futuras</span>

    <label class="switch">
        <input type="checkbox" id="editAll">
        <span class="slider"></span>
    </label>
</div>

<button onclick="save()">Salvar</button>
<button id="deleteBtn" class="delete" onclick="remove()">Excluir</button>
<div id="parcelDeleteOptions" style="display:none;margin-top:8px">

    <div style="display:flex;gap:8px">

        <button
    class="delete"
    onclick="removeAllParcels()">
    Excluir todas
</button>

        <button
    class="delete"
    onclick="removeCurrentParcel()">
    Somente esta
</button>

    </div>

</div>
<button class="cancel" onclick="closeModal()">Cancelar</button>

</div>
</div>

<div class="modal" id="categoryModal">
  <div class="modal-content">

    <h3 style="margin:0 0 10px 0">Categorias</h3>

    <input id="categoryName" placeholder="Nome da categoria">

    <button onclick="saveCategory()">Salvar</button>

    <div id="categoryList" style="margin-top:12px"></div>

    <button class="cancel" onclick="closeCategoryModal()">Fechar</button>

  </div>
</div>

<script>
  // 🔒 Se não veio do login, volta para o login
  if (localStorage.getItem("logged") !== "true") {
    window.location.href = "index.html";
  }

  // 🔥 Remove o acesso imediatamente
  // Assim, qualquer reload ou nova abertura pede o código de novo
  localStorage.removeItem("logged");
</script>

<script>

let currentMonth = new Date();
let editId = null;
let editMonthKey = null;
let currentType = "income";
let editingParcelData = null;
let editingItem = null;
let activeMonthRef = null;

const monthLabel = document.getElementById("monthLabel");
const modal = document.getElementById("modal");
const deleteBtn = document.getElementById("deleteBtn");
const valueInput = document.getElementById("value");
const receivedInput = document.getElementById("receivedValue");

/* =========================
   UTIL
========================= */
valueInput.addEventListener("input",()=>{
  let v = valueInput.value.replace(/\D/g,"");
  v = (Number(v)/100).toLocaleString("pt-BR",{minimumFractionDigits:2});
  valueInput.value = v;
});

receivedInput.addEventListener("input",()=>{
  let v = receivedInput.value.replace(/\D/g,"");
  v = (Number(v)/100).toLocaleString("pt-BR",{minimumFractionDigits:2});
  receivedInput.value = v;
});

function updateMonthLabel(){
  const meses=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
  monthLabel.innerText = `${meses[currentMonth.getMonth()]} ${currentMonth.getFullYear()}`;
}

function getMonthKey(){
  return `${currentMonth.getFullYear()}-${String(currentMonth.getMonth()+1).padStart(2,"0")}`;
}

function formatDate(d){
  const [y,m,day]=d.split("-");
  return `${day}/${m}`;
}

/* =========================
   FIREBASE REFS
========================= */
function monthRef(){
  return firebase.database().ref("finance/meses/"+getMonthKey());
}

function categoriesRef(){
  return firebase.database().ref("finance/categorias");
}

/* =========================
   MÊS
========================= */
function changeMonth(step){
  currentMonth = new Date(
    currentMonth.getFullYear(),
    currentMonth.getMonth() + step,
    1 // 👈 força dia 1
  );

  updateMonthLabel();
  render();
}

/* =========================
   TYPE
========================= */
function setType(t){

    currentType = t;

    document.querySelectorAll(".type-btn")
        .forEach(b => b.classList.remove("active"));

    document.querySelector(`.type-btn.${t}`)
        .classList.add("active");

    const area = document.getElementById("receivedArea");

    if(t === "income" && !paid.checked){
        area.style.display = "block";
    }else{
        area.style.display = "none";
    }

}

/* =========================
   PARCELAMENTO
========================= */
let isParcel = false;
let isFixed = false;

function toggleParcel(){
  isParcel = !isParcel;
  
  isFixed = false;

document
    .getElementById("btnFixed")
    .classList.remove("active");

  const btn = document.getElementById("btnParcel");
  const input = document.getElementById("parcelCount");

  btn.classList.toggle("active", isParcel);
  input.style.display = isParcel ? "block" : "none";

  if(!isParcel && !isFixed){
    
    input.value = "";
  }
}

function toggleFixed(){

    isFixed = !isFixed;

    if(isFixed){

        isParcel = false;

        document.getElementById("btnParcel")
            .classList.remove("active");

        document.getElementById("parcelCount")
            .style.display = "none";

    }

    document.getElementById("btnFixed")
        .classList.toggle("active", isFixed);

}

function checkMonthTurnover(){
  const today = new Date();
  const day = today.getDate();

  // 🔒 só executa no dia 1
  if(day !== 1) return;

  const currentMonthKey =
    `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,"0")}`;

  const prev = new Date(today);
  prev.setMonth(prev.getMonth() - 1);

  const prevMonthKey =
    `${prev.getFullYear()}-${String(prev.getMonth()+1).padStart(2,"0")}`;

  // evita recalcular se já existir saldo salvo
  firebase.database()
    .ref("finance/saldos/" + currentMonthKey)
    .once("value", snap=>{
    

      firebase.database()
        .ref("finance/meses/" + prevMonthKey)
        .once("value", snapPrev=>{
          const data = snapPrev.val() || {};
          let saldoFinal = 0;

          Object.values(data).forEach(t=>{
            if(!t.paid) return;

            if(t.type === "income"){
              saldoFinal += t.value;
            }else{
              saldoFinal -= t.value;
            }
          });

          firebase.database()
            .ref("finance/saldos/" + currentMonthKey)
            .set(saldoFinal);
        });
    });
}

/* =========================
   RENDER
========================= */
function render(){
  const container = document.getElementById("list");
  container.innerHTML = "";

  // Remove o listener do mês anterior
  if (activeMonthRef) {
    activeMonthRef.off("value");
  }

  // Guarda a referência do mês atual
  activeMonthRef = monthRef();

  activeMonthRef.on("value", async snap => {
    const data = snap.val() || {};

    // Zera os totais a cada atualização do Firebase
    let rPago = 0,
        rPrev = 0,
        dPago = 0,
        dPrev = 0,
        dAtrasadas = 0;

    const list = Object.values(data)
      .sort((a,b)=>new Date(b.date)-new Date(a.date));

    container.innerHTML = "";

    // BUSCA SALDO DO MÊS ANTERIOR
    let saldoInicial = 0;

    const saldoKey = getMonthKey(); // mês exibido

const snapSaldo = await firebase
  .database()
  .ref("finance/saldos/" + saldoKey)
  .once("value");

saldoInicial = Number(snapSaldo.val() || 0);

    // ==========================
    // AGRUPA POR DATA
    // ==========================
    const groupedByDate = {};

    list.forEach(t=>{
      if(!groupedByDate[t.date]){
        groupedByDate[t.date] = [];
      }
      groupedByDate[t.date].push(t);
    });

    Object.keys(groupedByDate)
      .sort((a,b)=>new Date(b)-new Date(a))
      .forEach(date=>{

        const row = document.createElement("div");
        row.className = "row";

        const dateCard = document.createElement("div");
        dateCard.className = "date-card";
        dateCard.innerText = formatDate(date);

        const itemsWrap = document.createElement("div");
        itemsWrap.className = "day-items";
        itemsWrap.style.flex = "1";

        groupedByDate[date]
          .sort((a,b)=>b.value - a.value)
          .forEach((t,index)=>{

            if(t.type === "income"){

  // Valor realmente recebido
const recebido = t.receivedValue || (t.paid ? t.value : 0);

// Soma apenas o que entrou
rPago += recebido;

// Soma somente o que ainda falta receber
rPrev += (t.value - recebido);

}else{

    t.paid ? dPago += t.value : dPrev += t.value;

}

            const todayStr = getTodayLocalString();
            const isLate = !t.paid && t.date < todayStr;
            if (t.type === "expense" && isLate) {
    dAtrasadas += t.value;
}
            const isDueToday = !t.paid && t.date === todayStr;

            const item = document.createElement("div");
item.className = "item";

if(t.paid){
    item.classList.add("paid-item");
}else if(isLate){
    item.classList.add("late-item");
}else if(isDueToday){
    item.classList.add("due-today-item");
}

            if(index === 0) item.classList.add("first-of-day");
            if(index === groupedByDate[date].length - 1)
              item.classList.add("last-of-day");

            item.onclick = () => editById(t.id);

            item.innerHTML = `
<div class="item-top">

    <div class="item-name">
        ${t.name}
    </div>

    <div class="item-value ${t.type}">
        R$ ${t.value.toLocaleString("pt-BR",{minimumFractionDigits:2})}
    </div>

</div>

<div class="item-bottom">

    <div class="item-sub">
    ${t.category}
    ${
    t.fixed
    ? `<span class="fixed-badge">FIXA</span>`

        : t.parcel

            ? `<span class="parcel-badge">
                  ${t.parcelIndex}/${t.parcelTotal}
              </span>`

            : ``
}
</div>

    ${
        t.paid
        ? `<div class="badge green">${t.type==="income"?"Recebido":"Pago"}</div>`
        : isLate
            ? `<div class="badge red">Atrasado</div>`
            : isDueToday
                ? `<div class="badge orange">Vence hoje</div>`
                : `<div></div>`

async function save() {
    const db = firebase.database();

    const valTotal = Number(
        valueInput.value.replace(/\./g, "").replace(",", ".")
    );

    let valReceived = Number(
        (receivedInput.value || "0")
            .replace(/\./g, "")
            .replace(",", ".")
    ) || 0;

    const baseDateStr = date.value;

    if (!title.value.trim() || !baseDateStr ||
        !Number.isFinite(valTotal) || valTotal <= 0) {
        alert("Informe o nome, a data e um valor válido.");
        return;
    }

    if (currentType === "income" && paid.checked) {
        valReceived = valTotal;
    }

    valReceived = Math.max(0, Math.min(valTotal, valReceived));

    const remaining = Math.max(0, valTotal - valReceived);
    const newMonthKey = getMonthKeyFromDate(baseDateStr);
    const editAll = document.getElementById("editAll").checked;

    function makeDate(dateStr, offset) {
        const [year, month, day] = dateStr.split("-").map(Number);
        const target = new Date(year, month - 1 + offset, 1);
        const lastDay = new Date(
            target.getFullYear(),
            target.getMonth() + 1,
            0
        ).getDate();

        target.setDate(Math.min(day, lastDay));

        return [
            target.getFullYear(),
            String(target.getMonth() + 1).padStart(2, "0"),
            String(target.getDate()).padStart(2, "0")
        ].join("-");
    }

    function makeNormalItem(id) {
        return {
            id,
            name: title.value.trim(),
            value: valTotal,
            receivedValue: currentType === "income" ? valReceived : 0,
            remainingValue: currentType === "income" ? remaining : 0,
            category: category.value,
            date: baseDateStr,
            type: currentType,
            paid: paid.checked,
            parcel: false,
            fixed: false,
            parcelIndex: null,
            parcelTotal: null,
            parcelGroupId: null
        };
    }

    async function getAllMonths() {
        const snap = await db.ref("finance/meses").once("value");
        return snap.val() || {};
    }

    async function removeGroupFromCurrent(groupId, startIndex) {
        if (!groupId) {
            throw new Error("Não foi possível identificar o grupo.");
        }

        const months = await getAllMonths();
        const updates = {};

        Object.keys(months).forEach(month => {
            Object.keys(months[month] || {}).forEach(id => {
                const item = months[month][id];

                if (
                    item.parcelGroupId === groupId &&
                    Number(item.parcelIndex) >= Number(startIndex)
                ) {
                    updates[`finance/meses/${month}/${id}`] = null;
                }
            });
        });

        if (Object.keys(updates).length) {
            await db.ref().update(updates);
        }
    }

    async function createSeries(fixed) {
        const total = fixed ? 12 : Number(parcelCount.value || 0);

        if (!fixed && (!Number.isInteger(total) || total < 2)) {
            alert("Informe a quantidade de parcelas (mínimo 2).");
            return false;
        }

        const groupId = Date.now().toString() +
            "_" + Math.random().toString(36).slice(2, 7);

        const updates = {};

        for (let i = 0; i < total; i++) {
            const dateStr = makeDate(baseDateStr, i);
            const id = `${groupId}_${i + 1}`;
            const isFirst = i === 0;
            const recebido = currentType === "income" && isFirst
                ? valReceived
                : 0;

            const item = {
                id,
                name: title.value.trim(),
                value: valTotal,
                receivedValue: recebido,
                remainingValue: currentType === "income"
                    ? Math.max(0, valTotal - recebido)
                    : 0,
                category: category.value,
                date: dateStr,
                type: currentType,
                paid: isFirst ? paid.checked : false,
                parcel: !fixed,
                fixed,
                parcelIndex: i + 1,
                parcelTotal: total,
                parcelGroupId: groupId
            };

            const month = getMonthKeyFromDate(dateStr);
            updates[`finance/meses/${month}/${id}`] = item;
        }

        await db.ref().update(updates);
        return true;
    }

    try {
        // 1. Parcela continua parcelada.
        if (editingItem?.parcel && isParcel) {
            if (editAll) {
                await updateParcelGroup(valReceived, remaining);
            } else {
                await updateCurrentParcel(valReceived, remaining);
            }

            closeModal();
            render();
            return;
        }

        // 2. Conta fixa continua fixa.
        if (editingItem?.fixed && isFixed) {
            if (editAll) {
                await updateFixedGroup(valReceived, remaining);
            } else {
                const item = {
                    ...editingItem,
                    name: title.value.trim(),
                    value: valTotal,
                    category: category.value,
                    date: baseDateStr,
                    type: currentType,
                    paid: paid.checked,
                    receivedValue: currentType === "income" ? valReceived : 0,
                    remainingValue: currentType === "income" ? remaining : 0
                };

                const updates = {};
                updates[`finance/meses/${editMonthKey}/${editId}`] = null;
                updates[`finance/meses/${newMonthKey}/${editId}`] = item;

                await db.ref().update(updates);
            }

            closeModal();
            render();
            return;
        }

        // 3. Parcela vira conta fixa: preserva as anteriores.
        if (editingItem?.parcel && isFixed) {
            await convertParcelToFixed(valReceived, remaining);

            closeModal();
            render();
            return;
        }

        // 4. Conta fixa vira parcelamento: preserva as anteriores.
        if (editingItem?.fixed && isParcel) {
            const total = Number(parcelCount.value || 0);

            if (!Number.isInteger(total) || total < 2) {
                alert("Informe a quantidade de parcelas (mínimo 2).");
                return;
            }

            const months = await getAllMonths();
            const updates = {};
            const groupId = Date.now().toString() +
                "_" + Math.random().toString(36).slice(2, 7);

            let index = 0;

            // Mantém os registros anteriores e transforma
            // somente a conta atual e as futuras.
            Object.keys(months).forEach(month => {
                Object.keys(months[month] || {}).forEach(id => {
                    const item = months[month][id];

                    if (
                        item.parcelGroupId === editingItem.parcelGroupId &&
                        item.fixed &&
                        Number(item.parcelIndex) >=
                            Number(editingItem.parcelIndex)
                    ) {
                        index++;

                        const dateStr = makeDate(baseDateStr, index - 1);
                        const newId = `${groupId}_${index}`;
                        const isCurrent = id === editId;
                        const recebido = isCurrent
                            ? valReceived
                            : Number(item.receivedValue || 0);

                        updates[`finance/meses/${month}/${id}`] = null;

                        const newItem = {
                            ...item,
                            id: newId,
                            name: title.value.trim(),
                            value: valTotal,
                            category: category.value,
                            date: dateStr,
                            type: currentType,
                            paid: isCurrent ? paid.checked : item.paid,
                            receivedValue: currentType === "income"
                                ? recebido
                                : 0,
                            remainingValue: currentType === "income"
                                ? Math.max(0, valTotal - recebido)
                                : 0,
                            fixed: false,
                            parcel: true,
                            parcelIndex: index,
                            parcelTotal: total,
                            parcelGroupId: groupId
                        };

                        const newMonth = getMonthKeyFromDate(dateStr);
                        updates[`finance/meses/${newMonth}/${newId}`] = newItem;
                    }
                });
            });

            if (index === 0) {
                throw new Error("Nenhuma conta futura foi encontrada.");
            }

            await db.ref().update(updates);
            closeModal();
            render();
            return;
        }

        // 5. Parcelado/fixo vira lançamento normal:
        // preserva o histórico anterior e substitui o trecho atual/futuro.
        if (
            (editingItem?.parcel || editingItem?.fixed) &&
            !isParcel &&
            !isFixed
        ) {
            await removeGroupFromCurrent(
                editingItem.parcelGroupId,
                editingItem.parcelIndex
            );

            const id = Date.now().toString() +
                "_" + Math.random().toString(36).slice(2, 7);

            await db.ref(
                `finance/meses/${newMonthKey}/${id}`
            ).set(makeNormalItem(id));

            closeModal();
            render();
            return;
        }

        // 6. Normal vira parcelado/fixo.
        if (
            !editingItem?.parcel &&
            !editingItem?.fixed &&
            (isParcel || isFixed)
        ) {
            const ok = await createSeries(isFixed);
            if (!ok) return;

            if (editId && editMonthKey) {
                await db.ref(
                    `finance/meses/${editMonthKey}/${editId}`
                ).remove();
            }

            closeModal();
            render();
            return;
        }

        // 7. Cria ou edita lançamento normal.
        if (!isParcel && !isFixed) {
            const id = editId || Date.now().toString();
            const item = makeNormalItem(id);
            const updates = {};

            if (editId && editMonthKey && editMonthKey !== newMonthKey) {
                updates[`finance/meses/${editMonthKey}/${editId}`] = null;
            }

            updates[`finance/meses/${newMonthKey}/${id}`] = item;

            await db.ref().update(updates);

            closeModal();
            render();
            return;
        }

        // 8. Novo parcelamento ou nova conta fixa.
        const ok = await createSeries(isFixed);
        if (!ok) return;

        closeModal();
        render();

    } catch (error) {
        console.error("Erro ao salvar lançamento:", error);
        alert("Não foi possível salvar. Verifique a conexão e tente novamente.");
    }
}

async function convertParcelToFixed(valReceived, remaining){

    const snap = await firebase.database()
        .ref("finance/meses")
        .once("value");

    const meses = snap.val() || {};
    const promises = [];

    const novoValor = Number(
        valueInput.value.replace(/\./g,"").replace(",",".")
    );

    const novoDia = new Date(date.value).getDate();

    Object.keys(meses).forEach(mes=>{

        Object.keys(meses[mes]).forEach(id=>{

            const item = meses[mes][id];

            if(
                item.parcelGroupId === editingItem.parcelGroupId &&
                item.parcelIndex >= editingItem.parcelIndex
            ){

                item.fixed = true;
                item.parcel = false;

                item.name = title.value.trim();
                item.category = category.value;
                item.value = novoValor;
                item.type = currentType;

                const data = new Date(item.date);
                data.setDate(novoDia);
                item.date = data.toISOString().split("T")[0];

                if(item.id === editingItem.id){

                    item.paid = paid.checked;

                    if(currentType==="income"){
                        item.receivedValue = valReceived;
                        item.remainingValue = remaining;
                    }

                }else{

                    item.remainingValue = Math.max(
                        0,
                        novoValor-(item.receivedValue||0)
                    );

                }

                promises.push(
                    firebase.database()
                    .ref("finance/meses/"+mes+"/"+id)
                    .set(item)
                );

            }

        });

    });

    await Promise.all(promises);

}

  const today = new Date();

  // só no dia 1
  if(today.getDate() !== 1){
    return null;
  }

  // mês exibido
  const renderYear = currentMonth.getFullYear();
  const renderMonth = currentMonth.getMonth();

  // mês real atual
  const realYear = today.getFullYear();
  const realMonth = today.getMonth();

  // 🔒 só herda se estiver exibindo o mês atual real
  if(renderYear !== realYear || renderMonth !== realMonth){
    return null;
  }

  // mês anterior real
  const prev = new Date(realYear, realMonth - 1, 1);

  return `${prev.getFullYear()}-${String(prev.getMonth()+1).padStart(2,"0")}`;
}
