<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Minhas Finanças</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1E293B">

<style>
:root {
  --fundo-tela: #F8FAFC;
  --fundo-card: #FFFFFF;
  --fundo-header: linear-gradient(180deg, #1E293B 0%, #334155 100%);
  --cor-saldo: #2563EB;
  --cor-receita: #10B981;
  --cor-despesa: #EF4444;
  --cor-alerta: #F59E0B;
  --texto-principal: #1E293B;
  --texto-secundario: #94A3B8;
  --borda-suave: #E2E8F0;
  --sombra: 0 1px 6px rgba(15,23,42,0.04);
  --raio: 12px;
  --raio-p: 8px;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}

body {
  background: var(--fundo-tela);
  color: var(--texto-principal);
  padding-top: 150px;
  font-size: 14px;
}

/* ---------------- CABEÇALHO ---------------- */
.header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 40;
  background: var(--fundo-header);
  padding: 16px 16px 28px;
  border-radius: 0 0 20px 20px;
  color: white;
}

.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}

.top h1 {
  font-size: 20px;
  font-weight: 600;
}

.acoes-topo {
  display: flex;
  gap: 8px;
}

.btn-topo {
  width: 40px;
  height: 40px;
  border-radius: var(--raio);
  background: rgba(255,255,255,0.1);
  border: none;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

.navegacao-mes {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 24px;
}

.btn-mes {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: rgba(255,255,255,0.1);
  border: none;
  color: white;
  font-size: 18px;
  cursor: pointer;
}

#nomeMes {
  font-size: 16px;
  font-weight: 500;
  min-width: 140px;
  text-align: center;
}

/* ---------------- CARDS RESUMO ---------------- */
.cards-resumo {
  position: fixed;
  top: 120px;
  left: 12px;
  right: 12px;
  z-index: 30;
  display: flex;
  gap: 8px;
}

.card {
  flex: 1;
  background: var(--fundo-card);
  border-radius: var(--raio);
  padding: 12px 8px;
  text-align: center;
  box-shadow: var(--sombra);
  position: relative;
  overflow: hidden;
}

.card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
}

.card h4 {
  font-size: 11px;
  font-weight: 500;
  color: var(--texto-secundario);
  margin-bottom: 4px;
  text-transform: uppercase;
}

.valor-principal {
  font-size: 15px;
  font-weight: 700;
}

.valor-secundario {
  font-size: 10px;
  color: var(--texto-secundario);
  margin-top: 2px;
}

.card-saldo::before { background: var(--cor-saldo); }
.card-saldo .valor-principal { color: var(--cor-saldo); }

.card-receita::before { background: var(--cor-receita); }
.card-receita .valor-principal { color: var(--cor-receita); }

.card-despesa::before { background: var(--cor-despesa); }
.card-despesa .valor-principal { color: var(--cor-despesa); }

/* ---------------- LISTA ---------------- */
.lista {
  padding: 16px 12px 80px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.cabecalho-data {
  display: flex;
  align-items: center;
  gap: 6px;
  margin: 4px 0;
}

.cabecalho-data span {
  font-size: 12px;
  font-weight: 600;
  color: var(--texto-secundario);
}

.cabecalho-data::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--borda-suave);
}

/* CARD TRANSAÇÃO */
.card-transacao {
  background: var(--fundo-card);
  border-radius: var(--raio);
  padding: 14px 16px;
  box-shadow: var(--sombra);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 12px;
  transition: all 0.15s ease;
}

.card-transacao:active {
  transform: scale(0.99);
}

.icone {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  font-weight: 700;
  flex-shrink: 0;
}

.icone-receita { background: #D1FAE5; color: var(--cor-receita); }
.icone-despesa { background: #FEE2E2; color: var(--cor-despesa); }

.info {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.nome {
  font-size: 14px;
  font-weight: 600;
  color: var(--texto-principal);
}

.detalhes {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.categoria {
  font-size: 12px;
  color: var(--texto-secundario);
}

.etiqueta-parcela {
  padding: 2px 6px;
  background: var(--fundo-tela);
  border-radius: var(--raio-p);
  font-size: 10px;
  font-weight: 600;
  color: var(--texto-principal);
}

.lado-direito {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 6px;
}

.valor {
  font-size: 15px;
  font-weight: 700;
}

.valor.receita { color: var(--cor-receita); }
.valor.despesa { color: var(--cor-despesa); }

.status {
  padding: 3px 8px;
  border-radius: 10px;
  font-size: 10px;
  font-weight: 700;
  color: white;
  text-transform: uppercase;
}

.status-pago { background: var(--cor-receita); }
.status-atrasado { background: var(--cor-despesa); }
.status-hoje { background: var(--cor-alerta); }

/* BOTÃO FLUTUANTE */
.botao-add {
  position: fixed;
  right: 16px;
  bottom: 16px;
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: var(--cor-saldo);
  color: white;
  border: none;
  font-size: 26px;
  cursor: pointer;
  box-shadow: 0 4px 12px rgba(37,99,235,0.3);
  z-index: 50;
}

/* MODAL */
.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  backdrop-filter: blur(4px);
  justify-content: center;
  align-items: flex-end;
  z-index: 100;
}

.conteudo-modal {
  width: 100%;
  max-width: 420px;
  background: white;
  border-radius: 20px 20px 0 0;
  padding: 24px 18px 36px;
  animation: subir 0.2s ease;
}

@keyframes subir {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}

.botoes-tipo {
  display: flex;
  gap: 10px;
  margin-bottom: 18px;
}

.btn-tipo {
  flex: 1;
  padding: 12px;
  border-radius: var(--raio);
  border: 2px solid var(--borda-suave);
  background: white;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s ease;
}

.btn-tipo.receita.ativo {
  border-color: var(--cor-receita);
  background: var(--cor-receita);
  color: white;
}

.btn-tipo.despesa.ativo {
  border-color: var(--cor-despesa);
  background: var(--cor-despesa);
  color: white;
}

.campo {
  width: 100%;
  padding: 12px 14px;
  margin-top: 10px;
  border: 2px solid var(--borda-suave);
  border-radius: var(--raio);
  font-size: 15px;
  font-weight: 500;
  background: white;
  color: var(--texto-principal);
}

.campo:focus {
  outline: none;
  border-color: var(--cor-saldo);
}

.btn-parcelar {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border: 2px solid var(--borda-suave);
  border-radius: var(--raio);
  background: white;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
}

.btn-parcelar.ativo {
  border-color: var(--cor-saldo);
  background: rgba(37,99,235,0.05);
}

#qtd-parcelas { display: none; }

.linha-switch {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 18px;
  font-size: 15px;
  font-weight: 600;
}

.switch { position: relative; width: 44px; height: 24px; }
.switch input { display: none; }
.alavanca {
  position: absolute;
  inset: 0;
  background: var(--borda-suave);
  border-radius: 24px;
  transition: all 0.15s ease;
}
.alavanca::before {
  content: '';
  position: absolute;
  width: 18px;
  height: 18px;
  left: 3px;
  top: 3px;
  background: white;
  border-radius: 50%;
}
input:checked + .alavanca { background: var(--cor-receita); }
input:checked + .alavanca::before { transform: translateX(20px); }

.botao-salvar {
  width: 100%;
  padding: 14px;
  margin-top: 18px;
  border: none;
  border-radius: var(--raio);
  background: var(--cor-saldo);
  color: white;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
}

.botao-cancelar {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border: none;
  border-radius: var(--raio);
  background: var(--borda-suave);
  color: var(--texto-principal);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
}

.botao-excluir {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border: none;
  border-radius: var(--raio);
  background: var(--cor-despesa);
  color: white;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  display: none;
}

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-thumb { background: var(--borda-suave); border-radius: 2px; }
</style>
</head>

<body>

<div class="header">
  <div class="top">
    <h1>💰 Minhas Finanças</h1>
    <div class="acoes-topo">
      <button class="btn-topo" onclick="abrirCategorias()">☰</button>
      <button class="btn-topo" onclick="irRelatorios()">📊</button>
    </div>
  </div>
  <div class="navegacao-mes">
    <button class="btn-mes" onclick="mudarMes(-1)">‹</button>
    <span id="nomeMes"></span>
    <button class="btn-mes" onclick="mudarMes(1)">›</button>
  </div>
</div>

<div class="cards-resumo">
  <div class="card card-saldo">
    <h4>Saldo</h4>
    <div class="valor-principal" id="saldoPago">R$ 0,00</div>
    <div class="valor-secundario" id="saldoPrev">R$ 0,00</div>
  </div>
  <div class="card card-receita">
    <h4>Receitas</h4>
    <div class="valor-principal" id="recPago">R$ 0,00</div>
    <div class="valor-secundario" id="recPrev">R$ 0,00</div>
  </div>
  <div class="card card-despesa">
    <h4>Despesas</h4>
    <div class="valor-principal" id="despPago">R$ 0,00</div>
    <div class="valor-secundario" id="despPrev">R$ 0,00</div>
  </div>
</div>

<div class="lista" id="lista"></div>
<button class="botao-add" onclick="abrirModal()">+</button>

<div class="modal" id="modal">
  <div class="conteudo-modal">
    <div class="botoes-tipo">
      <button class="btn-tipo receita ativo" onclick="definirTipo('receita')">Receita</button>
      <button class="btn-tipo despesa" onclick="definirTipo('despesa')">Despesa</button>
    </div>
    <input type="text" class="campo" id="nome" placeholder="Nome da transação">
    <input type="text" class="campo" id="valor" placeholder="Valor">
    <select class="campo" id="categoria">
      <option>Geral</option>
      <option>Alimentação</option>
      <option>Moradia</option>
      <option>Transporte</option>
    </select>
    <input type="date" class="campo" id="data">
    <button class="btn-parcelar" id="btnParcelar" onclick="alternarParcelado()">Parcelado</button>
    <input type="number" class="campo" id="qtd-parcelas" min="2" placeholder="Quantidade">
    <div class="linha-switch">
      <span>Já foi pago?</span>
      <label class="switch">
        <input type="checkbox" id="pago">
        <span class="alavanca"></span>
      </label>
    </div>
    <button class="botao-salvar" onclick="salvar()">Salvar</button>
    <button class="botao-excluir" id="btnExcluir" onclick="excluir()">Excluir</button>
    <button class="botao-cancelar" onclick="fecharModal()">Cancelar</button>
  </div>
</div>

<div class="modal" id="modalCategorias">
  <div class="conteudo-modal">
    <h3 style="text-align:center; margin-bottom:16px; font-size:17px;">Categorias</h3>
    <input type="text" class="campo" id="nomeCategoria" placeholder="Nome da categoria">
    <button class="botao-salvar" onclick="salvarCategoria()">Adicionar</button>
    <div id="listaCategorias" style="margin-top:12px;"></div>
    <button class="botao-cancelar" onclick="fecharCategorias()">Fechar</button>
  </div>
</div>

<script>
if (localStorage.getItem("logged") !== "true") window.location.href = "index.html";
localStorage.removeItem("logged");
</script>

<script>
let mesAtual = new Date();
let idEdicao = null, chaveMesEdicao = null, tipoAtual = "receita", dadosParcelamentoEdicao = null;
const valorInput = document.getElementById("valor");

valorInput.addEventListener("input", () => {
  let v = valorInput.value.replace(/\D/g, "");
  v = (Number(v)/100).toLocaleString("pt-BR", {minimumFractionDigits:2});
  valorInput.value = v;
});

function atualizarMes() {
  const m = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
  document.getElementById("nomeMes").innerText = `${m[mesAtual.getMonth()]} ${mesAtual.getFullYear()}`;
}

function chaveMes() {
  return `${mesAtual.getFullYear()}-${String(mesAtual.getMonth()+1).padStart(2,"0")}`;
}

function formatarData(d) {
  const [y,m,dia] = d.split("-");
  const ds = new Date(d+"T00:00:00");
  const sem = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
  return `${dia}/${m} · ${sem[ds.getDay()]}`;
}

function mudarMes(p) {
  mesAtual = new Date(mesAtual.getFullYear(), mesAtual.getMonth()+p, 1);
  atualizarMes(); renderizar();
}

function definirTipo(t) {
  tipoAtual = t;
  document.querySelectorAll(".btn-tipo").forEach(b=>b.classList.remove("ativo"));
  document.querySelector(`.btn-tipo.${t}`).classList.add("ativo");
}

let parcelado = false;
function alternarParcelado() {
  parcelado = !parcelado;
  const b = document.getElementById("btnParcelar");
  const i = document.getElementById("qtd-parcelas");
  b.classList.toggle("ativo", parcelado);
  i.style.display = parcelado ? "block" : "none";
  if (!parcelado) i.value = "";
}

function renderizar() {
  const lista = document.getElementById("lista");
  lista.innerHTML = "";
  let recP = 0, recT = 0, despP = 0, despT = 0;

  firebase.database().ref("finance/meses/"+chaveMes()).off();
  firebase.database().ref("finance/meses/"+chaveMes()).on("value", async snap => {
    const dados = snap.val() || {};
    const itens = Object.values(dados).sort((a,b) => new Date(b.date) - new Date(a.date));
    lista.innerHTML = "";

    let saldoInicial = 0;
    const saldoSnap = await firebase.database().ref("finance/saldos/"+chaveMes()).once("value");
    saldoInicial = Number(saldoSnap.val() || 0);

    const agrupado = {};
    itens.forEach(i => { agrupado[i.date] = agrupado[i.date] || []; agrupado[i.date].push(i); });

    Object.keys(agrupado).sort((a,b) => new Date(b) - new Date(a)).forEach(data => {
      const cab = document.createElement("div");
      cab.className = "cabecalho-data";
      cab.innerHTML = `<span>${formatarData(data)}</span>`;
      lista.appendChild(cab);

      agrupado[data].sort((a,b) => b.value - a.value).forEach(trans => {
        if (trans.type === "receita") trans.paid ? recP += trans.value : recT += trans.value;
        else trans.paid ? despP += trans.value : despT += trans.value;

        const hoje = new Date().toISOString().split("T")[0];
        const atrasado = !trans.paid && trans.date < hoje;
        const venceHoje = !trans.paid && trans.date === hoje;

        const card = document.createElement("div");
        card.className = "card-transacao";
        card.onclick = () => editar(trans.id);

        const icone = trans.type === "receita" ? "↑" : "↓";
        const classeIcone = trans.type === "receita" ? "icone-receita" : "icone-despesa";
        const sinal = trans.type === "receita" ? "+ " : "- ";

        let statusHtml = "";
        if (trans.paid) statusHtml = `<span class="status status-pago">${trans.type==='receita'?'Recebido':'Pago'}</span>`;
        else if (atrasado) statusHtml = `<span class="status status-atrasado">Atrasado</span>`;
        else if (venceHoje) statusHtml = `<span class="status status-hoje">Vence hoje</span>`;

        let parcelaHtml = trans.parcel ? `<span class="etiqueta-parcela">${trans.parcelIndex} de ${trans.parcelTotal}</span>` : "";

        card.innerHTML = `
          <div class="icone ${classeIcone}">${icone}</div>
          <div class="info">
            <div class="nome">${trans.name}</div>
            <div class="detalhes">
              <span class="categoria">${trans.category}</span>
              ${parcelaHtml}
            </div>
          </div>
          <div class="lado-direito">
            <span class="valor ${trans.type}">${sinal}R$ ${trans.value.toLocaleString("pt-BR",{minimumFractionDigits:2})}</span>
            ${statusHtml}
          </div>
        `;
        lista.appendChild(card);
      });
    });

    recPago.innerText = `R$ ${recP.toLocaleString("pt-BR",{minimumFractionDigits:2})}`;
    recPrev.innerText = `R$ ${(recP+recT).toLocaleString("pt-BR",{minimumFractionDigits:2})}`;
    despPago.innerText = `R$ ${despP.toLocaleString("pt-BR",{minimumFractionDigits:2})}`;
    despPrev.innerText = `R$ ${(despP+despT).toLocaleString("pt-BR",{minimumFractionDigits:2})}`;
    saldoPago.innerText = `R$ ${(saldoInicial+recP-despP).toLocaleString("pt-BR",{minimumFractionDigits:2})}`;
    saldoPrev.innerText = `R$ ${(saldoInicial+recP+recT-despP-despT).toLocaleString("pt-BR",{minimumFractionDigits:2})}`;
  });
}

function salvar() {
  const valor = Number(valorInput.value.replace(/\./g,"").replace(",","."));
  const dataBase = document.getElementById("data").value;

  if (!parcelado) {
    const id = idEdicao || Date.now().toString();
    const item = {
      id, name: document.getElementById("nome").value.trim(), value: valor, category: document.getElementById("categoria").value, date: dataBase,
      type: tipoAtual, paid: document.getElementById("pago").checked,
      parcel: dadosParcelamentoEdicao ? true : false,
      parcelIndex: dadosParcelamentoEdicao?.parcelIndex || null,
      parcelTotal: dadosParcelamentoEdicao?.parcelTotal || null,
      parcelGroupId: dadosParcelamentoEdicao?.parcelGroupId || null
    };
    const novaChave = `${dataBase.split("-")[0]}-${dataBase.split("-")[1]}`;
    if (idEdicao && chaveMesEdicao && chaveMesEdicao !== novaChave) {
      firebase.database().ref("finance/meses/"+chaveMesEdicao+"/"+id).remove();
    }
    firebase.database().ref("finance/meses/"+novaChave+"/"+id).set(item);
    fecharModal(); renderizar(); return;
  }

  const qtd = Number(document.getElementById("qtd-parcelas").value || 0);
  if (qtd < 2) { alert("Informe a quantidade de parcelas"); return; }
  const grupo = Date.now().toString();
  const dataObj = new Date(dataBase);
  for (let i=0; i<qtd; i++) {
    const d = new Date(dataObj); d.setMonth(d.getMonth()+i);
    const dataStr = d.toISOString().split("T")[0];
    const chave = `${dataStr.split("-")[0]}-${dataStr.split("-")[1]}`;
    const id = `${grupo}_${i+1}`;
    const item = {
      id, name: document.getElementById("nome").value.trim(), value: valor, category: document.getElementById("categoria").value, date: dataStr,
      type: tipoAtual, paid: false, parcel: true, parcelIndex: i+1, parcelTotal: qtd, parcelGroupId: grupo
    };
    firebase.database().ref("finance/meses/"+chave+"/"+id).set(item);
  }
  fecharModal(); renderizar();
}

function editar(id) {
  const chaveOrigem = chaveMes();
  firebase.database().ref("finance/meses/"+chaveOrigem+"/"+id).once("value", snap => {
    const t = snap.val(); if (!t) return;
    document.getElementById("nome").value = t.name;
    valorInput.value = t.value.toLocaleString("pt-BR",{minimumFractionDigits:2});
    document.getElementById("categoria").value = t.category;
    document.getElementById("data").value = t.date;
    document.getElementById("pago").checked = t.paid;
    tipoAtual = t.type; definirTipo(tipoAtual);
    dadosParcelamentoEdicao = t.parcel ? {parcelIndex:t.parcelIndex,parcelTotal:t.parcelTotal,parcelGroupId:t.parcelGroupId} : null;
    idEdicao = id; chaveMesEdicao = chaveOrigem; document.getElementById("btnExcluir").style.display = "block"; abrirModal();
  });
}

function excluir() {
  if (!idEdicao) return;
  firebase.database().ref("finance/meses/"+chaveMes()+"/"+idEdicao).remove();
  fecharModal(); renderizar();
}

function abrirModal() {
  document.getElementById("modal").style.display = "flex";
  if (!idEdicao) {
    document.getElementById("nome").value = ""; valorInput.value = "";
    document.getElementById("categoria").value = "Geral"; document.getElementById("pago").checked = false;
    definirTipo("receita"); parcelado = false;
    document.getElementById("btnParcelar").classList.remove("ativo");
    document.getElementById("qtd-parcelas").style.display = "none";
    const hoje = new Date();
    document.getElementById("data").value = `${hoje.getFullYear()}-${String(hoje.getMonth()+1).padStart(2,"0")}-${String(hoje.getDate()).padStart(2,"0")}`;
    document.getElementById("btnExcluir").style.display = "none";
  }
}

function fecharModal() {
  document.getElementById("modal").style.display = "none";
  parcelado = false; dadosParcelamentoEdicao = null; idEdicao = null; chaveMesEdicao = null;
}

function abrirCategorias() { document.getElementById("modalCategorias").style.display = "flex"; carregarCategorias(); }
function fecharCategorias() { document.getElementById("modalCategorias").style.display = "none"; }
function salvarCategoria() {
  const n = document.getElementById("nomeCategoria").value.trim(); if (!n) return;
  firebase.database().ref("finance/categorias/"+n).set(true);
  document.getElementById("nomeCategoria").value = ""; carregarCategorias(); atualizarSelectCategorias();
}
function apagarCategoria(n) { firebase.database().ref("finance/categorias/"+n).remove(); carregarCategorias(); atualizarSelectCategorias(); }
function carregarCategorias() {
  const c = document.getElementById("listaCategorias"); c.innerHTML = "";
  firebase.database().ref("finance/categorias").once("value", snap => {
    const d = snap.val() || {};
    Object.keys(d).sort().forEach(n => {
      const item = document.createElement("div");
      item.style = "display:flex;justify-content:space-between;align-items:center;padding:10px;background:#F8FAFC;border-radius:8px;margin-top:6px;font-size:13px;";
      item.innerHTML = `<span>${n}</span><button style="width:28px;height:28px;border-radius:50%;border:none;background:#FEE2E2;color:#EF4444;cursor:pointer;" onclick="apagarCategoria('${n}')">✕</button>`;
      c.appendChild(item);
    });
  });
}
function atualizarSelectCategorias() {
  const s = document.getElementById("categoria"); s.innerHTML = "";
  firebase.database().ref("finance/categorias").once("value", snap => {
    const d = snap.val() || {};
    Object.keys(d).forEach(n => { const o = document.createElement("option"); o.value = n; o.innerText = n; s.appendChild(o); });
  });
}
function irRelatorios() { window.location.href = "relatorios.html"; }
