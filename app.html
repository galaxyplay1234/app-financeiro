<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Minhas Finanças</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0F172A">

<style>
:root {
  /* Cores premium */
  --bg-principal: #F8FAFC;
  --bg-card: #FFFFFF;
  --bg-header: linear-gradient(160deg, #0F172A 0%, #1E293B 100%);
  --primaria: #3B82F6;
  --primaria-clara: #EFF6FF;
  --sucesso: #10B981;
  --sucesso-claro: #ECFDF5;
  --erro: #EF4444;
  --erro-claro: #FEF2F2;
  --aviso: #F59E0B;
  --aviso-claro: #FFFBEB;
  
  /* Texto */
  --texto-escuro: #1E293B;
  --texto-medio: #64748B;
  --texto-claro: #CBD5E1;
  
  /* Efeitos */
  --sombra-suave: 0 2px 20px rgba(15, 23, 42, 0.06);
  --sombra-media: 0 8px 30px rgba(15, 23, 42, 0.12);
  --sombra-elevada: 0 12px 40px rgba(59, 130, 246, 0.25);
  --raio-pequeno: 10px;
  --raio-medio: 16px;
  --raio-grande: 24px;
  --transicao: all 0.28s cubic-bezier(0.25, 0.8, 0.25, 1);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  background: var(--bg-principal);
  color: var(--texto-escuro);
  min-height: 100vh;
}

/* Cabeçalho Fixo */
.top-fixed {
  position: sticky;
  top: 0;
  z-index: 25;
  background: var(--bg-header);
  padding: 20px 20px 28px;
  border-bottom-left-radius: var(--raio-grande);
  border-bottom-right-radius: var(--raio-grande);
  box-shadow: var(--sombra-media);
}

header {
  color: white;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

header > div:first-child {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

header h2 {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.5px;
}

.header-actions {
  display: flex;
  gap: 10px;
}

.cat-btn {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  background: rgba(255,255,255,0.1);
  border: none;
  color: white;
  font-size: 18px;
  cursor: pointer;
  transition: var(--transicao);
  display: flex;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(10px);
}

.cat-btn:hover {
  background: rgba(255,255,255,0.18);
  transform: translateY(-2px);
}

.month-tabs {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 24px;
}

.month-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: rgba(255,255,255,0.1);
  border: none;
  color: white;
  font-size: 18px;
  cursor: pointer;
  transition: var(--transicao);
  display: flex;
  align-items: center;
  justify-content: center;
}

.month-btn:hover {
  background: rgba(255,255,255,0.2);
}

.month-btn:active {
  transform: scale(0.92);
}

#monthLabel {
  font-size: 16px;
  font-weight: 600;
  min-width: 150px;
  text-align: center;
}

/* Cards de Resumo */
.cards {
  display: flex;
  gap: 12px;
  padding: 0 20px;
  margin-top: -12px;
  position: relative;
  z-index: 2;
}

.card {
  flex: 1;
  background: var(--bg-card);
  border-radius: var(--raio-medio);
  padding: 16px 12px;
  text-align: center;
  box-shadow: var(--sombra-suave);
  transition: var(--transicao);
  position: relative;
  overflow: hidden;
}

.card::after {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
}

.card:hover {
  transform: translateY(-4px);
  box-shadow: var(--sombra-media);
}

.card h4 {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--texto-medio);
  margin-bottom: 4px;
}

.card .main {
  font-size: 17px;
  font-weight: 800;
  letter-spacing: -0.3px;
}

.card .sub {
  font-size: 11px;
  color: var(--texto-claro);
  margin-top: 2px;
}

.saldo::after { background: var(--primaria); }
.saldo .main { color: var(--primaria); }

.receita::after { background: var(--sucesso); }
.receita .main { color: var(--sucesso); }

.despesa::after { background: var(--erro); }
.despesa .main { color: var(--erro); }

/* Lista de Transações */
.list {
  padding: 24px 20px 100px;
}

.row {
  display: flex;
  gap: 12px;
  margin-bottom: 12px;
  align-items: flex-start;
}

.date-card {
  width: 54px;
  min-height: 60px;
  background: var(--bg-card);
  border-radius: var(--raio-pequeno);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  box-shadow: var(--sombra-suave);
  flex-shrink: 0;
}

.date-card span:first-child {
  font-size: 15px;
  font-weight: 700;
  color: var(--texto-escuro);
}

.date-card span:last-child {
  font-size: 10px;
  font-weight: 500;
  color: var(--texto-medio);
  text-transform: uppercase;
}

.day-items {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 1px;
  background: #F1F5F9;
  border-radius: var(--raio-medio);
  overflow: hidden;
  box-shadow: var(--sombra-suave);
}

.item {
  background: var(--bg-card);
  padding: 14px 16px;
  border-left: 3px solid var(--primaria);
  transition: var(--transicao);
  cursor: pointer;
}

.item:hover {
  background: #FAFBFC;
  padding-left: 20px;
}

.item-top {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 4px;
}

.item-name {
  font-size: 14px;
  font-weight: 600;
  color: var(--texto-escuro);
}

.item-value {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: -0.2px;
}

.income { color: var(--sucesso); }
.expense { color: var(--erro); }

.item-bottom {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.item-sub {
  font-size: 12px;
  color: var(--texto-medio);
  font-weight: 500;
}

.badge {
  padding: 3px 8px;
  border-radius: 20px;
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.3px;
  color: white;
}

.green { background: var(--sucesso); }
.red { background: var(--erro); }
.orange { background: var(--aviso); }

/* Status especiais */
.late-item {
  background: var(--erro-claro);
  border-left-color: var(--erro);
}
.late-item:hover { background: #FEE2E2; }

.due-today-item {
  background: var(--aviso-claro);
  border-left-color: var(--aviso);
}
.due-today-item:hover { background: #FEF3C7; }

/* Botão Flutuante */
.fab {
  position: fixed;
  right: 24px;
  bottom: 24px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primaria);
  color: white;
  border: none;
  font-size: 28px;
  cursor: pointer;
  box-shadow: var(--sombra-elevada);
  transition: var(--transicao);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 30;
}

.fab:hover {
  transform: scale(1.08) rotate(90deg);
  box-shadow: 0 16px 50px rgba(59, 130, 246, 0.35);
}

.fab:active {
  transform: scale(0.95);
}

/* Modais */
.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.6);
  backdrop-filter: blur(6px);
  justify-content: center;
  align-items: flex-end;
  z-index: 9999;
  animation: modalFade 0.2s ease-out;
}

@keyframes modalFade {
  from { opacity: 0; }
  to { opacity: 1; }
}

.modal-content {
  width: 100%;
  max-width: 420px;
  background: var(--bg-card);
  border-radius: var(--raio-grande) var(--raio-grande) 0 0;
  padding: 28px 24px 40px;
  box-shadow: var(--sombra-elevada);
  animation: modalSlide 0.3s ease-out;
  max-height: 90vh;
  overflow-y: auto;
}

@keyframes modalSlide {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}

.modal-content h3 {
  font-size: 18px;
  font-weight: 700;
  color: var(--texto-escuro);
  margin-bottom: 20px;
  text-align: center;
}

/* Botões de Tipo */
.type-buttons {
  display: flex;
  gap: 12px;
  margin-bottom: 16px;
}

.type-btn {
  flex: 1;
  padding: 14px;
  border-radius: var(--raio-medio);
  border: 2px solid #E2E8F0;
  background: white;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: var(--transicao);
  color: var(--texto-medio);
}

.type-btn.active.income {
  border-color: var(--sucesso);
  background: var(--sucesso-claro);
  color: var(--sucesso);
}

.type-btn.active.expense {
  border-color: var(--erro);
  background: var(--erro-claro);
  color: var(--erro);
}

/* Campos de Entrada */
.modal-content input,
.modal-content select {
  width: 100%;
  padding: 14px 16px;
  margin-top: 10px;
  border: 2px solid #E2E8F0;
  border-radius: var(--raio-medio);
  font-size: 15px;
  font-weight: 500;
  transition: var(--transicao);
  background: white;
  color: var(--texto-escuro);
}

.modal-content input::placeholder { color: var(--texto-claro); }
.modal-content input:focus,
.modal-content select:focus {
  outline: none;
  border-color: var(--primaria);
  box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
}

/* Parcelamento */
.parcel-buttons {
  display: flex;
  gap: 10px;
  margin-top: 10px;
  align-items: center;
}

.parcel-btn {
  flex: 1;
  padding: 14px !important;
  margin: 0 !important;
  border: 2px solid #E2E8F0 !important;
  background: white !important;
  color: var(--texto-medio) !important;
  font-weight: 600 !important;
  font-size: 14px !important;
}

.parcel-btn.active {
  border-color: var(--primaria) !important;
  background: var(--primaria-clara) !important;
  color: var(--primaria) !important;
}

#parcelCount {
  width: 120px !important;
  margin: 0 !important;
}

/* Switch */
.switch-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 18px;
  font-size: 15px;
  font-weight: 600;
  color: var(--texto-escuro);
}

.switch {
  position: relative;
  width: 50px;
  height: 28px;
}

.switch input { display: none; }

.slider {
  position: absolute;
  inset: 0;
  background: #CBD5E1;
  border-radius: 28px;
  transition: var(--transicao);
}

.slider:before {
  content: '';
  position: absolute;
  width: 22px;
  height: 22px;
  left: 3px;
  top: 3px;
  background: white;
  border-radius: 50%;
  transition: var(--transicao);
  box-shadow: var(--sombra-suave);
}

input:checked + .slider { background: var(--sucesso); }
input:checked + .slider:before { transform: translateX(22px); }

/* Botões do Modal */
.modal-content button {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  border: none;
  border-radius: var(--raio-medio);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: var(--transicao);
}

.modal-content button:hover { transform: translateY(-2px); }
.modal-content button:active { transform: translateY(0); }

.modal-content button:not(.cancel):not(.delete) {
  background: var(--primaria);
  color: white;
  box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
}

.modal-content button.cancel {
  background: #F1F5F9;
  color: var(--texto-medio);
}

.modal-content button.delete {
  background: var(--erro);
  color: white;
  box-shadow: 0 4px 12px rgba(239, 68, 68, 0.25);
}

/* Categorias */
.category-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 16px;
  background: #F8FAFC;
  border-radius: var(--raio-medio);
  margin-top: 8px;
  font-size: 14px;
  font-weight: 500;
  transition: var(--transicao);
}

.category-item:hover {
  background: #F1F5F9;
  padding-left: 20px;
}

.category-item button {
  width: 28px;
  height: 28px;
  padding: 0;
  margin: 0;
  border-radius: 50%;
  background: var(--erro-claro);
  color: var(--erro);
  font-size: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: none;
}

#categoryModal .modal-content { max-height: 85vh; }
#categoryList { margin-top: 10px; }

/* Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: #CBD5E1;
  border-radius: 3px;
}
::-webkit-scrollbar-thumb:hover { background: #94A3B8; }
</style>
</head>

<body>

<div class="top-fixed">
  <header>
    <div>
      <h2>💰 Minhas Finanças</h2>
      <div class="header-actions">
        <button class="cat-btn" onclick="openCategoryModal()">☰</button>
        <button class="cat-btn" onclick="goReports()">📊</button>
      </div>
    </div>
    <div class="month-tabs">
      <button class="month-btn" onclick="changeMonth(-1)">&#10094;</button>
      <span id="monthLabel"></span>
      <button class="month-btn" onclick="changeMonth(1)">&#10095;</button>
    </div>
  </header>
</div>

<section class="cards">
  <div class="card saldo">
    <h4>Saldo</h4>
    <div class="main" id="saldoPago">R$ 0,00</div>
    <div class="sub" id="saldoPrev">R$ 0,00</div>
  </div>
  <div class="card receita">
    <h4>Receitas</h4>
    <div class="main" id="recPago">R$ 0,00</div>
    <div class="sub" id="recPrev">R$ 0,00</div>
  </div>
  <div class="card despesa">
    <h4>Despesas</h4>
    <div class="main" id="despPago">R$ 0,00</div>
    <div class="sub" id="despPrev">R$ 0,00</div>
  </div>
</section>

<section class="list" id="list"></section>

<button class="fab" onclick="openModal()">+</button>

<div class="modal" id="modal">
<div class="modal-content">
  <div class="type-buttons">
    <button class="type-btn income active" onclick="setType('income')">Receita</button>
    <button class="type-btn expense" onclick="setType('expense')">Despesa</button>
  </div>
  <input id="title" placeholder="Nome da transação">
  <input id="value" placeholder="Valor">
  <select id="category">
    <option>Geral</option>
    <option>Alimentação</option>
    <option>Moradia</option>
    <option>Transporte</option>
  </select>
  <input id="date" type="date">
  <div class="parcel-buttons">
    <button id="btnParcel" class="parcel-btn" onclick="toggleParcel()">Parcelado</button>
    <input id="parcelCount" type="number" min="2" placeholder="Qtd." style="display:none">
  </div>
  <div class="switch-row">
    <span>Já foi pago?</span>
    <label class="switch">
      <input type="checkbox" id="paid">
      <span class="slider"></span>
    </label>
  </div>
  <button onclick="save()">Salvar transação</button>
  <button id="deleteBtn" class="delete" onclick="remove()">Excluir</button>
  <button class="cancel" onclick="closeModal()">Cancelar</button>
</div>
</div>

<div class="modal" id="categoryModal">
  <div class="modal-content">
    <h3>Gerenciar Categorias</h3>
    <input id="categoryName" placeholder="Nome da categoria">
    <button onclick="saveCategory()">Adicionar</button>
    <div id="categoryList"></div>
    <button class="cancel" onclick="closeCategoryModal()">Fechar</button>
  </div>
</div>

</script>

<script>
let currentMonth = new Date();
let editId = null;
let editMonthKey = null;
let currentType = "income";
let editingParcelData = null;

const monthLabel = document.getElementById("monthLabel");
const modal = document.getElementById("modal");
const deleteBtn = document.getElementById("deleteBtn");
const valueInput = document.getElementById("value");

valueInput.addEventListener("input",()=>{
  let v = valueInput.value.replace(/\D/g,"");
  v = (Number(v)/100).toLocaleString("pt-BR",{minimumFractionDigits:2});
  valueInput.value = v;
});

function updateMonthLabel(){
  const meses=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
  monthLabel.innerText = `${meses[currentMonth.getMonth()]} ${currentMonth.getFullYear()}`;
}

function getMonthKey(){
  return `${currentMonth.getFullYear()}-${String(currentMonth.getMonth()+1).padStart(2,"0")}`;
}

function formatDate(d){
  const [y,m,day]=d.split("-");
  return `${day}/${m}`;
}

function monthRef(){
  return firebase.database().ref("finance/meses/"+getMonthKey());
}

function categoriesRef(){
  return firebase.database().ref("finance/categorias");
}

function changeMonth(step){
  currentMonth = new Date(currentMonth.getFullYear(), currentMonth.getMonth() + step, 1);
  updateMonthLabel();
  render();
}

function setType(t){
  currentType=t;
  document.querySelectorAll(".type-btn").forEach(b=>b.classList.remove("active"));
  document.querySelector(`.type-btn.${t}`).classList.add("active");
}

let isParcel = false;
function toggleParcel(){
  isParcel = !isParcel;
  const btn = document.getElementById("btnParcel");
  const input = document.getElementById("parcelCount");
  btn.classList.toggle("active", isParcel);
  input.style.display = isParcel ? "block" : "none";
  if(!isParcel) input.value = "";
}

function checkMonthTurnover(){
  const today = new Date();
  if(today.getDate() !== 1) return;
  const currentMonthKey = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,"0")}`;
  const prev = new Date(today);
  prev.setMonth(prev.getMonth() - 1);
  const prevMonthKey = `${prev.getFullYear()}-${String(prev.getMonth()+1).padStart(2,"0")}`;

  firebase.database().ref("finance/saldos/" + currentMonthKey).once("value", snap=>{
    firebase.database().ref("finance/meses/" + prevMonthKey).once("value", snapPrev=>{
      const data = snapPrev.val() || {};
      let saldoFinal = 0;
      Object.values(data).forEach(t=>{
        if(!t.paid) return;
        saldoFinal += t.type === "income" ? t.value : -t.value;
      });
      firebase.database().ref("finance/saldos/" + currentMonthKey).set(saldoFinal);
    });
  });
}

function render(){
  const container = document.getElementById("list");
  container.innerHTML = "";
  let rPago = 0, rPrev = 0, dPago = 0, dPrev = 0;

  monthRef().off();
  monthRef().on("value", async snap=>{
    const data = snap.val() || {};
    const list = Object.values(data).sort((a,b)=>new Date(b.date)-new Date(a.date));
    container.innerHTML = "";

    let saldoInicial = 0;
    const saldoKey = getMonthKey();
    const snapSaldo = await firebase.database().ref("finance/saldos/" + saldoKey).once("value");
    saldoInicial = Number(snapSaldo.val() || 0);

    const groupedByDate = {};
    list.forEach(t=>{
      if(!groupedByDate[t.date]) groupedByDate[t.date] = [];
      groupedByDate[t.date].push(t);
    });

    Object.keys(groupedByDate).sort((a,b)=>new Date(b)-new Date(a)).forEach(date=>{
      const row = document.createElement("div");
      row.className = "row";

      const dateObj = new Date(date + "T00:00:00");
      const dayName = dateObj.toLocaleDateString("pt-BR", {weekday:'short'}).replace('.','');
      
      const dateCard = document.createElement("div");
      dateCard.className = "date-card";
      dateCard.innerHTML = `<span>${formatDate(date)}</span><span>${dayName}</span>`;

      const itemsWrap = document.createElement("div");
      itemsWrap.className = "day-items";

      groupedByDate[date].sort((a,b)=>b.value - a.value).forEach(t=>{
        if(t.type==="income"){ t.paid ? rPago+=t.value : rPrev+=t.value; }
        else{ t.paid ? dPago+=t.value : dPrev+=t.value; }

        const todayStr = getTodayLocalString();
        const isLate = !t.paid && t.date < todayStr;
        const isDueToday = !t.paid && t.date === todayStr;

        const item = document.createElement("div");
        item.className = "item";
        if(isLate) item.classList.add("late-item");
        else if(isDueToday) item.classList.add("due-today-item");
        item.onclick = () => editById(t.id);

        item.innerHTML = `
          <div class="item-top">
            <div class="item-name">${t.name}</div>
            <div class="item-value ${t.type}">R$ ${t.value.toLocaleString("pt-BR",{minimumFractionDigits:2})}</div>
          </div>
          <div class="item-bottom">
            <div class="item-sub">${t.category} ${t.parcel ? `<span style="margin-left:6px">${t.parcelIndex}/${t.parcelTotal}</span>` : ""}</div>
            ${t.paid ? `<div class="badge green">${t.type==="income"?"Recebido":"Pago"}</div>` : isLate ? `<div class="badge red">Atrasado</div>` : isDueToday ? `<div class="badge orange">Vence hoje</div>` : ""}
          </div>
        `;
        itemsWrap.appendChild(item);
      });

      row.appendChild(dateCard);
      row.appendChild(itemsWrap);
      container.appendChild(row);
    });

    recPago.innerText = `R$ ${rPago.toLocaleString("pt-BR",{minimumFractionDigits:2})}`;
    recPrev.innerText = `R$ ${(rPago+rPrev).toLocaleString("pt-BR",{minimumFractionDigits:2})}`;
    despPago.innerText = `R$ ${dPago.toLocaleString("pt-BR",{minimumFractionDigits:2})}`;
    despPrev.innerText = `R$ ${(dPago+dPrev).toLocaleString("pt-BR",{minimumFractionDigits:2})}`;
    saldoPago.innerText = `R$ ${(saldoInicial + rPago - dPago).toLocaleString("pt-BR",{minimumFractionDigits:2})}`;
    saldoPrev.innerText = `R$ ${(saldoInicial + rPago + rPrev - dPago - dPrev).toLocaleString("pt-BR",{minimumFractionDigits:2})}`;
  });
}

function save(){
  const valTotal = Number(valueInput.value.replace(/\./g,"").replace(",","."));
  const baseDateStr = date.value;

  if(!isParcel){
    const id = editId || Date.now().toString();
    const item = {
      id, name: title.value.trim(), value: valTotal, category: category.value, date: baseDateStr,
      type: currentType, paid: paid.checked,
      parcel: editingParcelData ? true : false,
      parcelIndex: editingParcelData ? editingParcelData.parcelIndex : null,
      parcelTotal: editingParcelData ? editingParcelData.parcelTotal : null,
      parcelGroupId: editingParcelData ? editingParcelData.parcelGroupId : null
    };
    const newMonthKey = getMonthKeyFromDate(item.date);
    if(editId && editMonthKey && editMonthKey !== newMonthKey){
      firebase.database().ref("finance/meses/" + editMonthKey + "/" + id).remove();
    }
    firebase.database().ref("finance/meses/" + newMonthKey + "/" + id).set(item);
    closeModal(); render(); return;
  }

  const totalParcels = Number(parcelCount.value || 0);
  if(totalParcels < 2){ alert("Informe a quantidade de parcelas"); return; }
  const parcelValue = valTotal;
  const groupId = Date.now().toString();
  const baseDate = new Date(baseDateStr);
  for(let i = 0; i < totalParcels; i++){
    const d = new Date(baseDate); d.setMonth(d.getMonth() + i);
    const dateStr = d.toISOString().split("T")[0];
    const monthKey = getMonthKeyFromDate(dateStr);
    const id = `${groupId}_${i+1}`;
    const item = {
      id, name: title.value.trim(), value: parcelValue, category: category.value, date: dateStr,
      type: currentType, paid: false, parcel: true, parcelIndex: i+1, parcelTotal: totalParcels, parcelGroupId: groupId
    };
    firebase.database().ref("finance/meses/" + monthKey + "/" + id).set(item);
  }
  closeModal(); render();
}

function editById(id){
  const originalMonthKey = getMonthKey();
  firebase.database().ref("finance/meses/" + originalMonthKey + "/" + id).once("value", snap=>{
    const t = snap.val(); if(!t) return;
    title.value = t.name;
    valueInput.value = t.value.toLocaleString("pt-BR",{minimumFractionDigits:2});
    category.value = t.category; date.value = t.date; paid.checked = t.paid; currentType = t.type;
    editingParcelData = t.parcel ? {parcelIndex:t.parcelIndex,parcelTotal:t.parcelTotal,parcelGroupId:t.parcelGroupId} : null;
    setType(currentType); editId = id; editMonthKey = originalMonthKey; deleteBtn.style.display = "block"; openModal();
  });
}

function remove(){ if(!editId) return; monthRef().child(editId).remove(); closeModal(); render(); }

function openModal(){
  modal.style.display="flex";
  if(editId===null){
    title.value=""; valueInput.value=""; category.value=""; paid.checked=false; setType("income");
    isParcel=false; document.getElementById("btnParcel").classList.remove("active");
    document.getElementById("parcelCount").style.display="none"; document.getElementById("parcelCount").value="";
    const hoje=new Date(); date.value=`${hoje.getFullYear()}-${String(hoje.getMonth()+1).padStart(2,"0")}-${String(hoje.getDate()).padStart(2,"0")}`;
    deleteBtn.style.display="none";
  }
}

function closeModal(){
  modal.style.display="none"; isParcel=false; editingParcelData=null;
  const btn=document.getElementById("btnParcel"); const input=document.getElementById("parcelCount");
  btn.classList.remove("active"); input.style.display="none"; input.value="";
  editId=null; editMonthKey=null;
}

function openCategoryModal(){ document.getElementById("categoryModal").style.display="flex"; renderCategories(); }
function closeCategoryModal(){ document.getElementById("categoryModal").style.display="none"; }
function saveCategory(){
  const input=document.getElementById("categoryName"); const name=input.value.trim(); if(!name) return;
  categoriesRef().child(name).set(true); input.value=""; renderCategories(); updateCategorySelect();
}
function deleteCategory(name){ categoriesRef().child(name).remove(); renderCategories(); updateCategorySelect(); }
function renderCategories(){
  const container=document.getElementById("categoryList"); container.innerHTML="";
  categoriesRef().once("value", snap=>{
    const data=snap.val()||{};
    Object.keys(data).sort((a,b)=>a.localeCompare(b,'pt-BR')).forEach(c=>{
      const div=document.createElement("div"); div.className="category-item";
      div.innerHTML=`<span>${c}</span><button onclick="deleteCategory('${c}')">✕</button>`;
      container.appendChild(div);
    });
  });
}
function updateCategorySelect(){
  const select=document.getElementById("category"); select.innerHTML="";
  categoriesRef().once("value", snap=>{
    const data=snap.val()||{};
    Object.keys(data).forEach(c=>{
      const opt=document.createElement("option"); opt.value=c; opt.innerText=c; select.appendChild(opt);
    });
  });
}

function goReports(){ window.location.href="relatorios.html"; }
function getMonthKeyFromDate(dateStr){ const [y,m]=dateStr.split("-"); return `${y}-${m}`; }
function getTodayLocalString(){ const n=new Date(); return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,"0")}-${String(n.getDate()).padStart(2,"0")}`; }
function getPreviousMonthKeyForRender(){ return null; }
