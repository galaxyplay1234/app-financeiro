<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Minhas Finanças</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1976d2">

<style>
*{box-sizing:border-box;font-family:'Segoe UI', Roboto, Arial, sans-serif;margin:0;padding:0}
body{
  background:#F8FAFC;
  overflow-x:hidden;
  padding-bottom:90px;
}

/* ---------------- CABEÇALHO AZUL ---------------- */
.header-principal{
  background:#1976D2;
  color:white;
  padding:20px 16px 32px;
  border-bottom-left-radius:24px;
  border-bottom-right-radius:24px;
  position:sticky;
  top:0;
  z-index:30;
}

.topo-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:24px;
}

.topo-header h1{
  font-size:24px;
  font-weight:700;
}

.acoes-header{
  display:flex;
  gap:12px;
}

.btn-icone{
  background:transparent;
  border:none;
  color:white;
  font-size:22px;
  cursor:pointer;
  padding:6px;
}

.navegacao-mes{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:24px;
}

.btn-mes{
  background:transparent;
  border:none;
  color:white;
  font-size:24px;
  cursor:pointer;
  padding:4px 8px;
}

#monthLabel{
  font-size:18px;
  font-weight:600;
  min-width:160px;
  text-align:center;
}

/* ---------------- CARDS DE SALDO ---------------- */
.card-saldo-geral{
  background:rgba(255,255,255,0.15);
  border-radius:16px;
  padding:24px 20px;
  margin:-16px 16px 24px;
  position:relative;
  z-index:25;
}

.saldo-titulo{
  font-size:16px;
  font-weight:500;
  opacity:0.9;
  margin-bottom:8px;
}

.saldo-valor{
  font-size:36px;
  font-weight:700;
  margin-bottom:20px;
}

.saldo-detalhes{
  display:flex;
  justify-content:space-between;
  font-size:16px;
}

.rec-valor{color:#4CAF50;font-weight:600}
.desp-valor{color:#F44336;font-weight:600}

/* ---------------- BOTÕES PRINCIPAIS ---------------- */
.botoes-acao{
  display:flex;
  gap:12px;
  padding:0 16px 24px;
}

.btn-receita{
  flex:1;
  background:#4CAF50;
  color:white;
  border:none;
  padding:14px;
  border-radius:12px;
  font-size:17px;
  font-weight:600;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  box-shadow:0 4px 12px rgba(76,175,80,0.3);
}

.btn-despesa{
  flex:1;
  background:#F44336;
  color:white;
  border:none;
  padding:14px;
  border-radius:12px;
  font-size:17px;
  font-weight:600;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  box-shadow:0 4px 12px rgba(244,67,54,0.3);
}

/* ---------------- LISTA TRANSAÇÕES ---------------- */
.secao-transacoes{
  padding:0 16px;
}

.cabecalho-lista{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:16px;
}

.cabecalho-lista h2{
  font-size:20px;
  font-weight:700;
  color:#1E293B;
}

.ver-todas{
  color:#1976D2;
  font-size:15px;
  font-weight:600;
  text-decoration:none;
  cursor:pointer;
}

.item-transacao{
  display:flex;
  align-items:center;
  gap:14px;
  padding:14px 0;
  border-bottom:1px solid #E2E8F0;
  cursor:pointer;
}

.item-transacao:last-child{border-bottom:none}

.icone-item{
  width:44px;
  height:44px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  flex-shrink:0;
}

.icone-receita{background:#E8F5E9;color:#4CAF50}
.icone-despesa{background:#FFEBEE;color:#F44336}

.info-item{
  flex:1;
  display:flex;
  flex-direction:column;
  gap:4px;
}

.nome-item{
  font-size:17px;
  font-weight:600;
  color:#1E293B;
}

.detalhe-item{
  font-size:14px;
  color:#64748B;
}

.valor-item{
  font-size:18px;
  font-weight:700;
}

.valor-receita{color:#4CAF50}
.valor-despesa{color:#F44336}

/* ---------------- MODAL ---------------- */
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.5);
  backdrop-filter:blur(4px);
  justify-content:center;
  align-items:center;
  z-index:9999;
}

.modal-content{
  background:white;
  width:90%;
  max-width:400px;
  padding:24px;
  border-radius:16px;
  box-shadow:0 8px 24px rgba(0,0,0,0.15);
}

.titulo-modal{
  font-size:20px;
  font-weight:700;
  text-align:center;
  margin-bottom:20px;
  color:#1E293B;
}

.type-buttons{
  display:flex;
  gap:10px;
  margin-bottom:16px;
}

.type-btn{
  flex:1;
  padding:12px;
  border-radius:10px;
  border:2px solid #E2E8F0;
  background:white;
  font-size:16px;
  font-weight:600;
  cursor:pointer;
  color:#64748B;
  transition:all 0.2s;
}

.type-btn.active.income{
  background:#4CAF50;
  border-color:#4CAF50;
  color:white;
}

.type-btn.active.expense{
  background:#F44336;
  border-color:#F44336;
  color:white;
}

.modal-content input,
.modal-content select{
  width:100%;
  padding:12px 14px;
  margin-top:10px;
  border:2px solid #E2E8F0;
  border-radius:10px;
  font-size:15px;
  background:white;
  color:#1E293B;
}

.modal-content input:focus,
.modal-content select:focus{
  outline:none;
  border-color:#1976D2;
}

.parcel-buttons{
  display:flex;
  gap:10px;
  margin-top:10px;
  align-items:center;
}

.parcel-btn{
  flex:1;
  padding:12px;
  border:2px solid #E2E8F0;
  border-radius:10px;
  background:white;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
  color:#64748B;
}

.parcel-btn.active{
  border-color:#1976D2;
  color:#1976D2;
  background:rgba(25,118,210,0.05);
}

#parcelCount{
  width:110px;
  display:none;
  margin:0;
}

.switch-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:16px;
  font-size:15px;
  font-weight:600;
  color:#1E293B;
}

.switch{position:relative;width:48px;height:26px}
.switch input{display:none}
.slider{
  position:absolute;
  inset:0;
  background:#CBD5E1;
  border-radius:26px;
  transition:0.2s;
}
.slider:before{
  content:"";
  position:absolute;
  width:20px;
  height:20px;
  left:3px;
  top:3px;
  background:white;
  border-radius:50%;
  transition:0.2s;
}
input:checked + .slider{background:#4CAF50}
input:checked + .slider:before{transform:translateX(22px)}

.modal-content button{
  width:100%;
  padding:14px;
  margin-top:12px;
  border:none;
  border-radius:10px;
  font-size:16px;
  font-weight:600;
  cursor:pointer;
}

.modal-content button:not(.cancel):not(.delete){
  background:#1976D2;
  color:white;
}

.modal-content button.cancel{
  background:#E2E8F0;
  color:#1E293B;
}

.modal-content button.delete{
  background:#F44336;
  color:white;
  display:none;
}

/* Categorias */
.category-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px;
  background:#F8FAFC;
  border-radius:10px;
  margin-top:8px;
  font-size:14px;
}

.category-item button{
  width:28px;
  height:28px;
  padding:0;
  margin:0;
  border-radius:50%;
  background:#FFEBEE;
  color:#F44336;
  border:none;
  font-size:16px;
  display:flex;
  align-items:center;
  justify-content:center;
}

#categoryModal .modal-content{max-height:85vh;overflow-y:auto}
</style>
</head>

<body>

<!-- Cabeçalho Principal -->
<div class="header-principal">
  <div class="topo-header">
    <h1>Minhas Finanças</h1>
    <div class="acoes-header">
      <button class="btn-icone" onclick="openCategoryModal()">☰</button>
      <button class="btn-icone" onclick="goReports()">📊</button>
    </div>
  </div>
  <div class="navegacao-mes">
    <button class="btn-mes" onclick="changeMonth(-1)">&#10094;</button>
    <span id="monthLabel"></span>
    <button class="btn-mes" onclick="changeMonth(1)">&#10095;</button>
  </div>
</div>

<!-- Card Saldo Geral -->
<div class="card-saldo-geral">
  <div class="saldo-titulo">Saldo Total</div>
  <div class="saldo-valor" id="saldoPago">R$ 0,00</div>
  <div class="saldo-detalhes">
    <div>Receitas<br><span class="rec-valor" id="recPago">R$ 0,00</span></div>
    <div>Despesas<br><span class="desp-valor" id="despPago">R$ 0,00</span></div>
  </div>
</div>

<!-- Botões Rápidos -->
<div class="botoes-acao">
  <button class="btn-receita" onclick="setType('income');openModal()">+ Nova Receita</button>
  <button class="btn-despesa" onclick="setType('expense');openModal()">− Nova Despesa</button>
</div>

<!-- Lista Transações -->
<div class="secao-transacoes">
  <div class="cabecalho-lista">
    <h2>Transações Recentes</h2>
    <span class="ver-todas" onclick="goReports()">Ver Todas</span>
  </div>
  <div id="list"></div>
</div>

<!-- Modal Transação -->
<div class="modal" id="modal">
  <div class="modal-content">
    <h3 class="titulo-modal" id="tituloModal">Nova Transação</h3>
    <div class="type-buttons">
      <button class="type-btn income active" onclick="setType('income')">Receita</button>
      <button class="type-btn expense" onclick="setType('expense')">Despesa</button>
    </div>
    <input id="title" placeholder="Nome da transação">
    <input id="value" placeholder="Valor">
    <select id="category">
      <option>Geral</option>
      <option>Alimentação</option>
      <option>Moradia</option>
      <option>Transporte</option>
    </select>
    <input id="date" type="date">
    <div class="parcel-buttons">
      <button id="btnParcel" class="parcel-btn" onclick="toggleParcel()">Parcelado</button>
      <input id="parcelCount" type="number" min="2" placeholder="Qtd.">
    </div>
    <div class="switch-row">
      <span>Já foi pago?</span>
      <label class="switch">
        <input type="checkbox" id="paid">
        <span class="slider"></span>
      </label>
    </div>
    <button onclick="save()">Salvar</button>
    <button id="deleteBtn" class="delete" onclick="remove()">Excluir</button>
    <button class="cancel" onclick="closeModal()">Cancelar</button>
  </div>
</div>

<!-- Modal Categorias -->
<div class="modal" id="categoryModal">
  <div class="modal-content">
    <h3 class="titulo-modal">Gerenciar Categorias</h3>
    <input id="categoryName" placeholder="Nome da categoria">
    <button onclick="saveCategory()">Adicionar</button>
    <div id="categoryList"></div>
    <button class="cancel" onclick="closeCategoryModal()">Fechar</button>
  </div>
</div>

<script>
  if (localStorage.getItem("logged") !== "true") window.location.href = "index.html";
  localStorage.removeItem("logged");
</script>

<script>
let currentMonth = new Date();
let editId = null;
let editMonthKey = null;
let currentType = "income";
let editingParcelData = null;

const monthLabel = document.getElementById("monthLabel");
const modal = document.getElementById("modal");
const deleteBtn = document.getElementById("deleteBtn");
const valueInput = document.getElementById("value");
const tituloModal = document.getElementById("tituloModal");

valueInput.addEventListener("input",()=>{
  let v = valueInput.value.replace(/\D/g,"");
  v = (Number(v)/100).toLocaleString("pt-BR",{minimumFractionDigits:2});
  valueInput.value = v;
});

function updateMonthLabel(){
  const meses=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
  monthLabel.innerText = `${meses[currentMonth.getMonth()]} ${currentMonth.getFullYear()}`;
}

function getMonthKey(){
  return `${currentMonth.getFullYear()}-${String(currentMonth.getMonth()+1).padStart(2,"0")}`;
}

function formatDate(d){
  const [y,m,day]=d.split("-");
  const data = new Date(d + "T00:00:00");
  const diasSemana = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
  return `${day}/${m} · ${diasSemana[data.getDay()]}`;
}

function monthRef(){
  return firebase.database().ref("finance/meses/"+getMonthKey());
}

function categoriesRef(){
  return firebase.database().ref("finance/categorias");
}

function changeMonth(step){
  currentMonth = new Date(currentMonth.getFullYear(), currentMonth.getMonth() + step, 1);
  updateMonthLabel();
  render();
}

function setType(t){
  currentType=t;
  document.querySelectorAll(".type-btn").forEach(b=>b.classList.remove("active"));
  document.querySelector(`.type-btn.${t}`).classList.add("active");
}

let isParcel = false;
function toggleParcel(){
  isParcel = !isParcel;
  const btn = document.getElementById("btnParcel");
  const input = document.getElementById("parcelCount");
  btn.classList.toggle("active", isParcel);
  input.style.display = isParcel ? "block" : "none";
  if(!isParcel) input.value = "";
}

function checkMonthTurnover(){
  const today = new Date();
  if(today.getDate() !== 1) return;
  const currentMonthKey = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,"0")}`;
  const prev = new Date(today);
  prev.setMonth(prev.getMonth() - 1);
  const prevMonthKey = `${prev.getFullYear()}-${String(prev.getMonth()+1).padStart(2,"0")}`;

  firebase.database().ref("finance/saldos/" + currentMonthKey).once("value", snap=>{
    firebase.database().ref("finance/meses/" + prevMonthKey).once("value", snapPrev=>{
      const data = snapPrev.val() || {};
      let saldoFinal = 0;
      Object.values(data).forEach(t=>{
        if(!t.paid) return;
        saldoFinal += t.type === "income" ? t.value : -t.value;
      });
      firebase.database().ref("finance/saldos/" + currentMonthKey).set(saldoFinal);
    });
  });
}

function render(){
  const container = document.getElementById("list");
  container.innerHTML = "";
  let rPago = 0, rPrev = 0, dPago = 0, dPrev = 0;

  monthRef().off();
  monthRef().on("value", async snap=>{
    const data = snap.val() || {};
    const list = Object.values(data).sort((a,b)=>new Date(b.date)-new Date(a.date));
    container.innerHTML = "";

    let saldoInicial = 0;
    const saldoKey = getMonthKey();
    const snapSaldo = await firebase.database().ref("finance/saldos/" + saldoKey).once("value");
    saldoInicial = Number(snapSaldo.val() || 0);

    const groupedByDate = {};
    list.forEach(t=>{
      if(!groupedByDate[t.date]) groupedByDate[t.date] = [];
      groupedByDate[t.date].push(t);
    });

    Object.keys(groupedByDate).sort((a,b)=>new Date(b)-new Date(a)).forEach(date=>{
      groupedByDate[date].sort((a,b)=>b.value - a.value).forEach(t=>{
        if(t.type==="income"){ t.paid ? rPago+=t.value : rPrev+=t.value; }
        else{ t.paid ? dPago+=t.value : dPrev+=t.value; }

        const todayStr = getTodayLocalString();
        const icone = t.type === "income" ? "↑" : "↓";
        const classeIcone = t.type === "income" ? "icone-receita" : "icone-despesa";
        const classeValor = t.type === "income" ? "valor-receita" : "valor-despesa";
        const sinal = t.type === "income" ? "+ " : "− ";

        let parcelText = "";
        if(t.parcel) parcelText = ` · ${t.parcelIndex} de ${t.parcelTotal}`;

        const item = document.createElement("div");
        item.className = "item-transacao";
        item.onclick = () => editById(t.id);
        item.innerHTML = `
          <div class="icone-item ${classeIcone}">${icone}</div>
          <div class="info-item">
            <div class="nome-item">${t.name}</div>
            <div class="detalhe-item">${t.category} · ${formatDate(date)}${parcelText}</div>
          </div>
          <div class="valor-item ${classeValor}">${sinal}R$ ${t.value.toLocaleString("pt-BR",{minimumFractionDigits:2})}</div>
        `;
        container.appendChild(item);
      });
    });

    recPago.innerText = `R$ ${(saldoInicial + rPago).toLocaleString("pt-BR",{minimumFractionDigits:2})}`;
    despPago.innerText = `R$ ${dPago.toLocaleString("pt-BR",{minimumFractionDigits:2})}`;
  });
}

function save(){
  const valTotal = Number(valueInput.value.replace(/\./g,"").replace(",","."));
  const baseDateStr = date.value;

  if(!isParcel){
    const id = editId || Date.now().toString();
    const item = {
      id, name: title.value.trim(), value: valTotal, category: category.value, date: baseDateStr,
      type: currentType, paid: paid.checked,
      parcel: editingParcelData ? true : false,
      parcelIndex: editingParcelData ? editingParcelData.parcelIndex : null,
      parcelTotal: editingParcelData ? editingParcelData.parcelTotal : null,
      parcelGroupId: editingParcelData ? editingParcelData.parcelGroupId : null
    };
    const newMonthKey = getMonthKeyFromDate(item.date);
    if(editId && editMonthKey && editMonthKey !== newMonthKey){
      firebase.database().ref("finance/meses/" + editMonthKey + "/" + id).remove();
    }
    firebase.database().ref("finance/meses/" + newMonthKey + "/" + id).set(item);
    closeModal(); render(); return;
  }

  const totalParcels = Number(parcelCount.value || 0);
  if(totalParcels < 2){ alert("Informe a quantidade de parcelas"); return; }
  const groupId = Date.now().toString();
  const baseDate = new Date(baseDateStr);
  for(let i = 0; i < totalParcels; i++){
    const d = new Date(baseDate); d.setMonth(d.getMonth() + i);
    const dateStr = d.toISOString().split("T")[0];
    const monthKey = getMonthKeyFromDate(dateStr);
    const id = `${groupId}_${i+1}`;
    const item = {
      id, name: title.value.trim(), value: valTotal, category: category.value, date: dateStr,
      type: currentType, paid: false, parcel: true, parcelIndex: i+1, parcelTotal: totalParcels, parcelGroupId: groupId
    };
    firebase.database().ref("finance/meses/" + monthKey + "/" + id).set(item);
  }
  closeModal(); render();
}

function editById(id){
  const originalMonthKey = getMonthKey();
  firebase.database().ref("finance/meses/" + originalMonthKey + "/" + id).once("value", snap=>{
    const t = snap.val(); if(!t) return;
    tituloModal.innerText = "Editar Transação";
    title.value = t.name;
    valueInput.value = t.value.toLocaleString("pt-BR",{minimumFractionDigits:2});
    category.value = t.category; date.value = t.date; paid.checked = t.paid; currentType = t.type;
    editingParcelData = t.parcel ? {parcelIndex:t.parcelIndex,parcelTotal:t.parcelTotal,parcelGroupId:t.parcelGroupId} : null;
    setType(currentType); editId = id; editMonthKey = originalMonthKey; deleteBtn.style.display = "block"; openModal();
  });
}

function remove(){ if(!editId) return; monthRef().child(editId).remove(); closeModal(); render(); }

function openModal(){
  modal.style.display="flex";
  if(editId===null){
    tituloModal.innerText = "Nova Transação";
    title.value=""; valueInput.value=""; category.value=""; paid.checked=false; setType("income");
    isParcel=false; document.getElementById("btnParcel").classList.remove("active");
    document.getElementById("parcelCount").style.display="none"; document.getElementById("parcelCount").value="";
    const hoje=new Date(); date.value=`${hoje.getFullYear()}-${String(hoje.getMonth()+1).padStart(2,"0")}-${String(hoje.getDate()).padStart(2,"0")}`;
    deleteBtn.style.display="none";
  }
}

function closeModal(){
  modal.style.display = "none"; isParcel=false; editingParcelData=null;
  editId=null; editMonthKey=null;
}

function openCategoryModal(){ document.getElementById("categoryModal").style.display="flex"; renderCategories(); }
function closeCategoryModal(){ document.getElementById("categoryModal").style.display="none"; }
function saveCategory(){
  const input=document.getElementById("categoryName"); const name=input.value.trim(); if(!name) return;
  categoriesRef().child(name).set(true); input.value=""; renderCategories(); updateCategorySelect();
}
function deleteCategory(name){ categoriesRef().child(name).remove(); renderCategories(); updateCategorySelect(); }
function renderCategories(){
  const container=document.getElementById("categoryList"); container.innerHTML="";
  categoriesRef().once("value", snap=>{
    const data=snap.val()||{};
    Object.keys(data).sort((a,b)=>a.localeCompare(b,'pt-BR')).forEach(c=>{
      const div=document.createElement("div"); div.className="category-item";
      div.innerHTML=`<span>${c}</span><button onclick="deleteCategory('${c}')">✕</button>`;
      container.appendChild(div);
    });
  });
}
function updateCategorySelect(){
  const select=document.getElementById("category"); select.innerHTML="";
  categoriesRef().once("value", snap=>{
    const data=snap.val()||{};
    Object.keys(data).forEach(c=>{
      const opt=document.createElement("option"); opt.value=c; opt.innerText=c; select.appendChild(opt);
    });
  });
}

function goReports(){ window.location.href="relatorios.html"; }
function getMonthKeyFromDate(dateStr){ const [y,m]=dateStr.split("-"); return `${y}-${m}`; }
function getTodayLocalString(){ const n=new Date(); return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,"0")}-${String(n.getDate()).padStart(2,"0")}`; }
</script>

  const firebaseConfig = {
