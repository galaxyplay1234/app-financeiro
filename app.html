<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Minhas Finanças</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#165DFF">

<style>
:root {
  --primary: #165DFF;
  --primary-light: #E8F3FF;
  --income: #00B42A;
  --income-light: #E8FFEA;
  --expense: #F53F3F;
  --expense-light: #FFECE8;
  --warning: #FF7D00;
  --warning-light: #FFF3E8;
  --neutral-100: #F7F8FA;
  --neutral-200: #E5E6EB;
  --neutral-300: #C9CDD4;
  --neutral-600: #4E5969;
  --neutral-800: #1D2129;
  --shadow-sm: 0 2px 8px rgba(0,0,0,0.08);
  --shadow-md: 0 4px 16px rgba(0,0,0,0.12);
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}

*{
  box-sizing:border-box;
  font-family: 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
  margin:0;
  padding:0;
}

body{
  margin:0;
  background:var(--neutral-100);
  overflow-x:hidden;
  color:var(--neutral-800);
  line-height:1.5;
}


.top-fixed{
  position:sticky;
  top:0;
  z-index:20;
  background:linear-gradient(180deg, var(--primary) 0%, #2970FF 100%);
  padding-bottom:16px;
  box-shadow:var(--shadow-md);
}

/* HEADER */
header{
  color:#fff;
  padding:20px 16px 12px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

header h2{
  margin:0;
  font-size:22px;
  font-weight:700;
  letter-spacing:-0.3px;
}

.header-actions{
  display:flex;
  gap:8px;
}

.cat-btn{
  background:rgba(255,255,255,0.15);
  border:none;
  color:#fff;
  font-size:18px;
  cursor:pointer;
  padding:8px 12px;
  border-radius:var(--radius-sm);
  transition:var(--transition);
  backdrop-filter:blur(4px);
}
.cat-btn:hover{
  background:rgba(255,255,255,0.25);
  transform:translateY(-1px);
}
.cat-btn:active{
  transform:translateY(0);
  opacity:0.8;
}

.month-tabs{
  width:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:20px;
  margin-top:4px;
}

.month-btn{
  background:rgba(255,255,255,0.15);
  border:none;
  color:#fff;
  font-size:20px;
  cursor:pointer;
  padding:6px 10px;
  border-radius:50%;
  transition:var(--transition);
  width:36px;
  height:36px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.month-btn:hover{
  background:rgba(255,255,255,0.25);
}
.month-btn:active{
  transform:scale(0.95);
}

#monthLabel{
  font-size:16px;
  font-weight:600;
  min-width:140px;
  text-align:center;
  text-shadow:0 1px 2px rgba(0,0,0,0.1);
}

/* CARDS */
.cards{
  display:flex;
  gap:12px;
  padding:0 16px;
  margin-top:8px;
}
.card{
  flex:1;
  background:#fff;
  padding:16px 12px;
  border-radius:var(--radius-md);
  text-align:center;
  box-shadow:var(--shadow-sm);
  transition:var(--transition);
  position:relative;
  overflow:hidden;
}
.card::before{
  content:"";
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:4px;
}
.card:hover{
  transform:translateY(-2px);
  box-shadow:var(--shadow-md);
}

.card h4{
  margin:0;
  font-size:12px;
  color:var(--neutral-600);
  font-weight:500;
  text-transform:uppercase;
  letter-spacing:0.5px;
}
.card .main{
  font-size:18px;
  font-weight:700;
  margin-top:6px;
  letter-spacing:-0.5px;
}
.card .sub{
  font-size:11px;
  color:var(--neutral-300);
  margin-top:2px;
}

.saldo::before{ background:var(--primary); }
.saldo .main{ color:var(--primary); }

.receita::before{ background:var(--income); }
.receita .main{ color:var(--income); }

.despesa::before{ background:var(--expense); }
.despesa .main{ color:var(--expense); }

/* LISTA */
.list{
  padding:16px;
  margin-top:8px;
}

.row{
  display:flex;
  gap:10px;
  margin-bottom:10px;
  cursor:pointer;
  align-items:flex-start;
}

.date-card{
  width:56px;
  min-height:64px;
  background:#fff;
  border-radius:var(--radius-md);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  font-size:14px;
  font-weight:700;
  color:var(--neutral-600);
  box-shadow:var(--shadow-sm);
  flex-shrink:0;
  transition:var(--transition);
}
.date-card span{
  font-size:11px;
  font-weight:500;
  color:var(--neutral-300);
}

.item{
  flex:1;
  background:#fff;
  padding:14px 12px;
  border-radius:var(--radius-md);
  border-left:5px solid var(--primary);
  box-shadow:var(--shadow-sm);
  transition:var(--transition);
}
.item:hover{
  transform:translateX(2px);
  box-shadow:var(--shadow-md);
}

.item-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:8px;
}
.item-name{
  font-weight:600;
  font-size:15px;
  color:var(--neutral-800);
}
.item-value{
  font-size:16px;
  font-weight:700;
  white-space:nowrap;
}
.income{ color:var(--income); }
.expense{ color:var(--expense); }

.item-bottom{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:6px;
}
.item-sub{
  font-size:12px;
  color:var(--neutral-600);
}
.badge{
  padding:3px 8px;
  font-size:11px;
  font-weight:600;
  border-radius:20px;
  color:#fff;
  white-space:nowrap;
  letter-spacing:0.3px;
}
.green{ background:var(--income); }
.red{ background:var(--expense); }
.orange{ background:var(--warning); }

/* AGRUPAMENTO */
.day-items{
  display:flex;
  flex-direction:column;
  gap:0;
  flex:1;
}
.item.first-of-day{
  border-bottom-left-radius:0;
  border-bottom-right-radius:0;
}
.item.middle-of-day{
  border-radius:0;
  border-top:1px solid var(--neutral-100);
}
.item.last-of-day{
  border-top-left-radius:0;
  border-top-right-radius:0;
}

/* STATUS ITEM */
.late-item{
  background:var(--expense-light);
  border-left-color:var(--expense);
}
.due-today-item{
  background:var(--warning-light);
  border-left-color:var(--warning);
}

/* FAB */
.fab{
  position:fixed;
  right:20px;
  bottom:24px;
  width:56px;
  height:56px;
  border-radius:50%;
  font-size:28px;
  background:var(--primary);
  color:#fff;
  border:none;
  box-shadow:0 4px 12px rgba(22,93,255,0.4);
  cursor:pointer;
  transition:var(--transition);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:30;
}
.fab:hover{
  transform:scale(1.05) rotate(90deg);
  box-shadow:0 6px 16px rgba(22,93,255,0.5);
}
.fab:active{
  transform:scale(0.95);
}

/* MODAL */
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.5);
  justify-content:center;
  align-items:center;
  z-index:9999;
  backdrop-filter:blur(4px);
  animation:fadeIn 0.2s ease-out;
}
@keyframes fadeIn{
  from{opacity:0}
  to{opacity:1}
}

.modal-content{
  background:#fff;
  width:90%;
  max-width:360px;
  padding:24px 20px;
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow-md);
  animation:slideUp 0.3s ease-out;
}
@keyframes slideUp{
  from{transform:translateY(20px); opacity:0}
  to{transform:translateY(0); opacity:1}
}

.modal-content h3{
  font-size:18px;
  font-weight:700;
  margin-bottom:16px;
  color:var(--neutral-800);
}

/* TYPE BUTTONS */
.type-buttons{
  display:flex;
  gap:10px;
  margin-bottom:16px;
}
.type-btn{
  flex:1;
  padding:12px;
  border-radius:var(--radius-md);
  background:#fff;
  border:2px solid var(--neutral-200);
  color:var(--neutral-600);
  font-weight:600;
  font-size:14px;
  cursor:pointer;
  transition:var(--transition);
}
.type-btn:hover{
  border-color:var(--neutral-300);
}

.type-btn.active.income{
  background:var(--income-light);
  color:var(--income);
  border-color:var(--income);
}
.type-btn.active.expense{
  background:var(--expense-light);
  color:var(--expense);
  border-color:var(--expense);
}

/* INPUTS */
.modal-content input,
.modal-content select,
.modal-content button{
  width:100%;
  margin-top:10px;
  padding:12px 14px;
  border-radius:var(--radius-md);
  border:1px solid var(--neutral-200);
  font-size:15px;
  transition:var(--transition);
  background:#fff;
  color:var(--neutral-800);
}
.modal-content input::placeholder{
  color:var(--neutral-300);
}
.modal-content input:focus,
.modal-content select:focus{
  outline:none;
  border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(22,93,255,0.1);
}

.modal-content input[type="date"]{
  -webkit-appearance:none;
  appearance:none;
}

/* SWITCH */
.switch-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:16px;
  font-size:15px;
  font-weight:500;
  color:var(--neutral-800);
}
.switch{
  position:relative;
  width:48px;
  height:26px;
}
.switch input{
  display:none;
}
.slider{
  position:absolute;
  inset:0;
  cursor:pointer;
  background:var(--neutral-200);
  border-radius:26px;
  transition:var(--transition);
}
.slider:before{
  content:"";
  position:absolute;
  width:20px;
  height:20px;
  left:3px;
  top:3px;
  background:#fff;
  border-radius:50%;
  transition:var(--transition);
  box-shadow:var(--shadow-sm);
}
input:checked + .slider{
  background:var(--income);
}
input:checked + .slider:before{
  transform:translateX(22px);
}

/* BUTTONS */
.modal-content button{
  font-weight:600;
  border:none;
  cursor:pointer;
  font-size:15px;
}
.modal-content button:hover{
  transform:translateY(-1px);
  box-shadow:var(--shadow-sm);
}
.modal-content button:active{
  transform:translateY(0);
}

.modal-content button:first-of-type{
  margin-top:20px;
}

.modal-content button:not(.cancel):not(.delete){
  background:var(--primary);
  color:#fff;
}
.modal-content button.cancel{
  background:var(--neutral-100);
  color:var(--neutral-600);
}
.modal-content button.delete{
  background:var(--expense);
  color:#fff;
}

/* PARCELAMENTO */
.parcel-buttons{
  display:flex;
  gap:10px;
  margin-top:10px;
  align-items:center;
}

.parcel-btn{
  width:auto !important;
  flex:1;
  background:#fff !important;
  color:var(--neutral-600) !important;
  border:1px solid var(--neutral-200) !important;
  font-weight:600 !important;
  font-size:14px !important;
  margin:0 !important;
}
.parcel-btn.active{
  border-color:var(--primary) !important;
  background:var(--primary-light) !important;
  color:var(--primary) !important;
}

#parcelCount{
  width:110px !important;
  margin:0 !important;
}

/* CATEGORIAS */
.category-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:var(--neutral-100);
  padding:10px 12px;
  border-radius:var(--radius-md);
  margin-top:8px;
  font-size:14px;
  font-weight:500;
  transition:var(--transition);
}
.category-item:hover{
  background:var(--neutral-200);
}

.category-item button{
  background:none;
  border:none;
  color:var(--expense);
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  width:24px;
  height:24px;
  padding:0;
  line-height:1;
  border-radius:50%;
  transition:var(--transition);
  margin:0 !important;
}
.category-item button:hover{
  background:var(--expense-light);
  transform:scale(1.1);
}

#categoryModal .modal-content{
  max-height:85vh;
  display:flex;
  flex-direction:column;
}

#categoryList{
  overflow-y:auto;
  max-height:280px;
  margin-top:10px;
}

/* SCROLLBAR PERSONALIZADA */
::-webkit-scrollbar{
  width:6px;
}
::-webkit-scrollbar-track{
  background:transparent;
}
::-webkit-scrollbar-thumb{
  background:var(--neutral-200);
  border-radius:3px;
}
::-webkit-scrollbar-thumb:hover{
  background:var(--neutral-300);
}
</style>
</head>

<body>

<div class="top-fixed">

  <header>
    <div style="width:100%;display:flex;justify-content:space-between;align-items:center">
      <h2>💰 Minhas Finanças</h2>
      <div class="header-actions">
        <button class="cat-btn" onclick="openCategoryModal()">☰</button>
        <button class="cat-btn" onclick="goReports()">📊</button>
      </div>
    </div>
    <div class="month-tabs">
      <button class="month-btn" onclick="changeMonth(-1)">&#10094;</button>
      <span id="monthLabel"></span>
      <button class="month-btn" onclick="changeMonth(1)">&#10095;</button>
    </div>
  </header>

  <section class="cards">
    <div class="card saldo">
      <h4>Saldo</h4>
      <div class="main" id="saldoPago">R$ 0,00</div>
      <div class="sub" id="saldoPrev">R$ 0,00</div>
    </div>

    <div class="card receita">
      <h4>Receitas</h4>
      <div class="main" id="recPago">R$ 0,00</div>
      <div class="sub" id="recPrev">R$ 0,00</div>
    </div>

    <div class="card despesa">
      <h4>Despesas</h4>
      <div class="main" id="despPago">R$ 0,00</div>
      <div class="sub" id="despPrev">R$ 0,00</div>
    </div>
  </section>

</div>

<section class="list" id="list"></section>

<button class="fab" onclick="openModal()">+</button>

<div class="modal" id="modal">
<div class="modal-content">

<div class="type-buttons">
  <button class="type-btn income active" onclick="setType('income')">Receita</button>
  <button class="type-btn expense" onclick="setType('expense')">Despesa</button>
</div>

<input id="title" placeholder="Nome da transação">
<input id="value" placeholder="Valor">
<select id="category">
  <option>Geral</option>
  <option>Alimentação</option>
  <option>Moradia</option>
  <option>Transporte</option>
</select>
<input id="date" type="date">
  
<div class="parcel-buttons">
  <button id="btnParcel" class="parcel-btn" onclick="toggleParcel()">
    Parcelado
  </button>
  <input
    id="parcelCount"
    type="number"
    min="2"
    placeholder="Qtd. parcelas"
    style="display:none"
  >
</div>

<div class="switch-row">
  <span>Já foi pago?</span>
  <label class="switch">
    <input type="checkbox" id="paid">
    <span class="slider"></span>
  </label>
</div>

<button onclick="save()">Salvar transação</button>
<button id="deleteBtn" class="delete" onclick="remove()">Excluir</button>
<button class="cancel" onclick="closeModal()">Cancelar</button>

</div>
</div>

<div class="modal" id="categoryModal">
  <div class="modal-content">

    <h3>Gerenciar Categorias</h3>

    <input id="categoryName" placeholder="Nova categoria">

    <button onclick="saveCategory()">Adicionar categoria</button>

    <div id="categoryList"></div>

    <button class="cancel" onclick="closeCategoryModal()">Fechar</button>

  </div>
</div>

<script>
let currentMonth = new Date();
let editId = null;
let editMonthKey = null;
let currentType = "income";
let editingParcelData = null;

const monthLabel = document.getElementById("monthLabel");
const modal = document.getElementById("modal");
const deleteBtn = document.getElementById("deleteBtn");
const valueInput = document.getElementById("value");

/* =========================
   UTIL
========================= */
valueInput.addEventListener("input",()=>{
  let v = valueInput.value.replace(/\D/g,"");
  v = (Number(v)/100).toLocaleString("pt-BR",{minimumFractionDigits:2});
  valueInput.value = v;
});

function updateMonthLabel(){
  const meses=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
  monthLabel.innerText = `${meses[currentMonth.getMonth()]} ${currentMonth.getFullYear()}`;
}

function getMonthKey(){
  return `${currentMonth.getFullYear()}-${String(currentMonth.getMonth()+1).padStart(2,"0")}`;
}

function formatDate(d){
  const [y,m,day]=d.split("-");
  return `${day}/${m}`;
}

/* =========================
   FIREBASE REFS
========================= */
function monthRef(){
  return firebase.database().ref("finance/meses/"+getMonthKey());
}

function categoriesRef(){
  return firebase.database().ref("finance/categorias");
}

/* =========================
   MÊS
========================= */
function changeMonth(step){
  currentMonth = new Date(
    currentMonth.getFullYear(),
    currentMonth.getMonth() + step,
    1
  );
  updateMonthLabel();
  render();
}

/* =========================
   TYPE
========================= */
function setType(t){
  currentType=t;
  document.querySelectorAll(".type-btn").forEach(b=>b.classList.remove("active"));
  document.querySelector(`.type-btn.${t}`).classList.add("active");
}

/* =========================
   PARCELAMENTO
========================= */
let isParcel = false;

function toggleParcel(){
  isParcel = !isParcel;
  const btn = document.getElementById("btnParcel");
  const input = document.getElementById("parcelCount");
  btn.classList.toggle("active", isParcel);
  input.style.display = isParcel ? "block" : "none";
  if(!isParcel) input.value = "";
}

function checkMonthTurnover(){
  const today = new Date();
  const day = today.getDate();
  if(day !== 1) return;

  const currentMonthKey = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,"0")}`;
  const prev = new Date(today);
  prev.setMonth(prev.getMonth() - 1);
  const prevMonthKey = `${prev.getFullYear()}-${String(prev.getMonth()+1).padStart(2,"0")}`;

  firebase.database()
    .ref("finance/saldos/" + currentMonthKey)
    .once("value", snap=>{
      firebase.database()
        .ref("finance/meses/" + prevMonthKey)
        .once("value", snapPrev=>{
          const data = snapPrev.val() || {};
          let saldoFinal = 0;
          Object.values(data).forEach(t=>{
            if(!t.paid) return;
            saldoFinal += t.type === "income" ? t.value : -t.value;
          });
          firebase.database().ref("finance/saldos/" + currentMonthKey).set(saldoFinal);
        });
    });
}

/* =========================
   RENDER
========================= */
function render(){
  const container = document.getElementById("list");
  container.innerHTML = "";
  let rPago = 0, rPrev = 0, dPago = 0, dPrev = 0;

  monthRef().off();
  monthRef().on("value", async snap=>{
    const data = snap.val() || {};
    const list = Object.values(data).sort((a,b)=>new Date(b.date)-new Date(a.date));
    container.innerHTML = "";

    let saldoInicial = 0;
    const saldoKey = getMonthKey();
    const snapSaldo = await firebase.database().ref("finance/saldos/" + saldoKey).once("value");
    saldoInicial = Number(snapSaldo.val() || 0);

    const groupedByDate = {};
    list.forEach(t=>{
      if(!groupedByDate[t.date]) groupedByDate[t.date] = [];
      groupedByDate[t.date].push(t);
    });

    const dates = Object.keys(groupedByDate).sort((a,b)=>new Date(b)-new Date(a));
    dates.forEach((date, dateIndex)=>{
      const row = document.createElement("div");
      row.className = "row";

      const dateObj = new Date(date + "T00:00:00");
      const dayName = dateObj.toLocaleDateString("pt-BR", {weekday:'short'}).replace('.','');
      
      const dateCard = document.createElement("div");
      dateCard.className = "date-card";
      dateCard.innerHTML = `${formatDate(date)}<span>${dayName}</span>`;

      const itemsWrap = document.createElement("div");
      itemsWrap.className = "day-items";

      const items = groupedByDate[date].sort((a,b)=>b.value - a.value);
      items.forEach((t,index)=>{
        if(t.type==="income"){
          t.paid ? rPago+=t.value : rPrev+=t.value;
        }else{
          t.paid ? dPago+=t.value : dPrev+=t.value;
        }

        const todayStr = getTodayLocalString();
        const isLate = !t.paid && t.date < todayStr;
        const isDueToday = !t.paid && t.date === todayStr;

        const item = document.createElement("div");
        item.className = "item";
        if(isLate) item.classList.add("late-item");
        else if(isDueToday) item.classList.add("due-today-item");

        if(index === 0) item.classList.add("first-of-day");
        else if(index === items.length - 1) item.classList.add("last-of-day");
        else item.classList.add("middle-of-day");

        item.onclick = () => editById(t.id);

        item.innerHTML = `
          <div class="item-top">
            <div class="item-name">${t.name}</div>
            <div class="item-value ${t.type}">
              R$ ${t.value.toLocaleString("pt-BR",{minimumFractionDigits:2})}
            </div>
          </div>
          <div class="item-bottom">
            <div class="item-sub">
              ${t.category}
              ${t.parcel ? `<span style="margin-left:6px">${t.parcelIndex}/${t.parcelTotal}</span>` : ""}
            </div>
            ${
              t.paid
                ? `<div class="badge green">${t.type==="income"?"Recebido":"Pago"}</div>`
                : isLate
                  ? `<div class="badge red">Atrasado</div>`
                  : isDueToday
                    ? `<div class="badge orange">Vence hoje</div>`
                    : ""
            }
          </div>
        `;
        itemsWrap.appendChild(item);
      });

      row.appendChild(dateCard);
      row.appendChild(itemsWrap);
      container.appendChild(row);
    });

    recPago.innerText = `R$ ${rPago.toLocaleString("pt-BR",{minimumFractionDigits:2})}`;
    recPrev.innerText = `R$ ${(rPago+rPrev).toLocaleString("pt-BR",{minimumFractionDigits:2})}`;
    despPago.innerText = `R$ ${dPago.toLocaleString("pt-BR",{minimumFractionDigits:2})}`;
    despPrev.innerText = `R$ ${(dPago+dPrev).toLocaleString("pt-BR",{minimumFractionDigits:2})}`;
    saldoPago.innerText = `R$ ${(saldoInicial + rPago - dPago).toLocaleString("pt-BR",{minimumFractionDigits:2})}`;
    saldoPrev.innerText = `R$ ${(saldoInicial + rPago + rPrev - dPago - dPrev).toLocaleString("pt-BR",{minimumFractionDigits:2})}`;
  });
}

/* =========================
   SAVE
========================= */
function save(){
  const valTotal = Number(valueInput.value.replace(/\./g,"").replace(",","."));
  const baseDateStr = date.value;

  if(!isParcel){
    const id = editId || Date.now().toString();
    const item = {
      id,
      name: title.value.trim(),
      value: valTotal,
      category: category.value,
      date: baseDateStr,
      type: currentType,
      paid: paid.checked,
      parcel: editingParcelData ? true : false,
      parcelIndex: editingParcelData ? editingParcelData.parcelIndex : null,
      parcelTotal: editingParcelData ? editingParcelData.parcelTotal : null,
      parcelGroupId: editingParcelData ? editingParcelData.parcelGroupId : null
    };

    const newMonthKey = getMonthKeyFromDate(item.date);
    if(editId && editMonthKey && editMonthKey !== newMonthKey){
      firebase.database().ref("finance/meses/" + editMonthKey + "/" + id).remove();
    }
    firebase.database().ref("finance/meses/" + newMonthKey + "/" + id).set(item);
    closeModal();
    render();
    return;
  }

  const totalParcels = Number(parcelCount.value || 0);
  if(totalParcels < 2){
    alert("Informe a quantidade de parcelas");
    return;
  }

  const parcelValue = valTotal;
  const groupId = Date.now().toString();
  const baseDate = new Date(baseDateStr);
  for(let i = 0; i < totalParcels; i++){
    const d = new Date(baseDate);
    d.setMonth(d.getMonth() + i);
    const dateStr = d.toISOString().split("T")[0];
    const monthKey = getMonthKeyFromDate(dateStr);
    const id = `${groupId}_${i+1}`;
    const item = {
      id,
      name: title.value.trim(),
      value: parcelValue,
      category: category.value,
      date: dateStr,
      type: currentType,
      paid: false,
      parcel: true,
      parcelIndex: i + 1,
      parcelTotal: totalParcels,
      parcelGroupId: groupId
    };
    firebase.database().ref("finance/meses/" + monthKey + "/" + id).set(item);
  }
  closeModal();
  render();
}

/* =========================
   EDIT
========================= */
function editById(id){
  const originalMonthKey = getMonthKey();
  firebase.database()
    .ref("finance/meses/" + originalMonthKey + "/" + id)
    .once("value", snap=>{
      const t = snap.val();
      if(!t) return;
      title.value = t.name;
      valueInput.value = t.value.toLocaleString("pt-BR",{minimumFractionDigits:2});
      category.value = t.category;
      date.value = t.date;
      paid.checked = t.paid;
      currentType = t.type;
      editingParcelData = t.parcel ? {
        parcelIndex: t.parcelIndex,
        parcelTotal: t.parcelTotal,
        parcelGroupId: t.parcelGroupId
      } : null;
      setType(currentType);
      editId = id;
      editMonthKey = originalMonthKey;
      deleteBtn.style.display = "block";
      openModal();
    });
}

/* =========================
   DELETE
========================= */
function remove(){
  if(!editId) return;
  monthRef().child(editId).remove();
  closeModal();
  render();
}

/* =========================
   MODAL
========================= */
function openModal(){
  modal.style.display="flex";
  if(editId===null){
    title.value="";
    valueInput.value="";
    category.value="";
    paid.checked=false;
    setType("income");
    isParcel = false;
    document.getElementById("btnParcel").classList.remove("active");
    document.getElementById("parcelCount").style.display = "none";
    document.getElementById("parcelCount").value = "";
    const hoje=new Date();
    date.value=`${hoje.getFullYear()}-${String(hoje.getMonth()+1).padStart(2,"0")}-${String(hoje.getDate()).padStart(2,"0")}`;
    deleteBtn.style.display="none";
  }
}

function closeModal(){
  modal.style.display = "none";
  isParcel = false;
  editingParcelData = null;
  const btn = document.getElementById("btnParcel");
  const input = document.getElementById("parcelCount");
  btn.classList.remove("active");
  input.style.display = "none";
  input.value = "";
  editId = null;
  editMonthKey = null;
}

/* =========================
   CATEGORIAS
========================= */
function openCategoryModal(){
  document.getElementById("categoryModal").style.display="flex";
  renderCategories();
}

function closeCategoryModal(){
  document.getElementById("categoryModal").style.display="none";
}

function saveCategory(){
  const input=document.getElementById("categoryName");
  const name=input.value.trim();
  if(!name) return;
  categoriesRef().child(name).set(true);
  input.value="";
  renderCategories();
  updateCategorySelect();
}

function deleteCategory(name){
  categoriesRef().child(name).remove();
  renderCategories();
  updateCategorySelect();
}

function renderCategories(){
  const container=document.getElementById("categoryList");
  container.innerHTML="";
  categoriesRef().once("value", snap=>{
    const data = snap.val() || {};
    Object.keys(data)
      .sort((a,b)=>a.localeCompare(b,'pt-BR'))
      .forEach(c=>{
        const div=document.createElement("div");
        div.className="category-item";
        div.innerHTML=`<span>${c}</span><button onclick="deleteCategory('${c}')">✕</button>`;
        container.appendChild(div);
      });
  });
}

function updateCategorySelect(){
  const select = document.getElementById("category");
  select.innerHTML="";
  categoriesRef().once("value", snap=>{
    const data = snap.val() || {};
    Object.keys(data).forEach(c=>{
      const opt=document.createElement("option");
      opt.value=c;
      opt.innerText=c;
      select.appendChild(opt);
    });
  });
}

function goReports(){
  window.location.href = "relatorios.html";
}

function getMonthKeyFromDate(dateStr){
  const [year, month] = dateStr.split("-");
  return `${year}-${month}`;
}

function getTodayLocalString(){
  const now = new Date();
  return `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")}`;
}

function getPreviousMonthKeyForRender(){
  const today = new Date();
  if(today.getDate() !== 1) return null;
  const renderYear = currentMonth.getFullYear();
  const renderMonth = currentMonth.getMonth();
  const realYear = today.getFullYear();
  const realMonth = today.getMonth();
  if(renderYear !== realYear || renderMonth !== realMonth) return null;
  const prev = new Date(realYear, realMonth - 1, 1);
  return `${prev.getFullYear()}-${String(prev.getMonth()+1).padStart(2,"0")}`;
}
